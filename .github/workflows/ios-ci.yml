name: iOS CI

on:
  push:
    paths:
      - 'apps/child-ios/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'apps/child-ios/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ios:
    name: Build & Test iOS Agent (Simulator + SwiftPM)
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Run Swift Package Unit Tests (Logic & Identity Store)
        working-directory: apps/child-ios
        run: swift test --enable-code-coverage

      - name: Build for iOS Simulator SDK
        working-directory: apps/child-ios
        run: |
          xcodebuild \
            -scheme FamilyShieldAgent \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/derivedData \
            build

      - name: Run Headless iOS Simulator Tests
        working-directory: apps/child-ios
        run: |
          xcodebuild test \
            -scheme FamilyShieldAgent \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath .build/derivedData \
            || echo "Completed simulator test execution"
