name: workflow-lint

# Guards against the class of failure that took CI down for a day (issue #37): `ci.yml` contained a
# step with both `uses:` and `run:`, YAML parsers accept it, GitHub rejects the whole file, and
# **every job was skipped** — so `main` had no CI signal at all.
#
# This lives in its own file on purpose: it still runs when another workflow file is invalid.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` (review N2): this workflow reads the PR title — the diff-scope check's declared kind comes
    # from it — so a retitle must re-run it. Without this a fixed title left the red run of the old one
    # standing, which is what happened to #279's `chore(process)` title.
    types: [opened, synchronize, reopened, edited]

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # osra-security#26, #609: no secret in the history or the tree. gitleaks is built from its Go module
      # at a pinned version (the Go checksum database verifies it), with the repo's own `.gitleaks.toml`
      # (default rules plus two reviewed fixtures) and `.gitleaksignore` (one reviewed historical line).
      # The whole history is scanned, not just this PR's commits: about 7 s for the repo today.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: No secret in the git history or the tree (gitleaks)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
          "$(go env GOPATH)/bin/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .
      - name: The gitleaks allowlist still catches a new key inside an allowlisted fixture file
        # Mutant guard (Antigravity, #767; deterministic canary after #727 and #831 flakes): without
        # `targetRules` the allowlist skips whole files. Assemble one fixed, vowel-free high-entropy probe
        # from 8-char chunks under `canary` (so Step 1 never matches this workflow file, and no random hex
        # draw can roll a gitleaks stopword or low-entropy sample) and require gitleaks to report it.
        run: |
          GL="$(go env GOPATH)/bin/gitleaks"
          canary="$(printf '%s-%s-%s-%s' '9Q7mZ2vX' '4nL8wR3j' '6bH5cF1g' '8pK2xN9q')"
          trap 'git checkout -- services/api/test/auth.test.ts scripts/hardware/scenario-family.test.mjs' EXIT
          for f in services/api/test/auth.test.ts scripts/hardware/scenario-family.test.mjs; do
            printf '\nconst unapprovedProbeKey = "%s";\n' "$canary" >> "$f"
            if "$GL" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 "$f" >/dev/null 2>&1; then
              echo "::error file=.gitleaks.toml::a new key in $f was not reported; the allowlist exempts the whole file"
              exit 1
            fi
            git checkout -- "$f"
            echo "caught: a new key in $f"
          done
      # Moved here from ci.yml (review N2): this gate reads the PR title, and `workflow-lint` runs on
      # `edited`, so a retitle re-checks it in ~20 s instead of rebuilding the Android app.
      - name: A code change carries a changelog fragment
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-changelog-fragment.mjs --base "origin/${{ github.base_ref }}"

      - name: Check .github/workflows for schema traps and gates that cannot fail
        # --strict: warnings (failure-swallowing steps) also fail the gate. Remove the flag if a
        # deliberate `|| true` is ever needed; do not add one without saying why in the PR.
        run: node scripts/check-workflows.mjs --strict

      - name: The launch-failure classifier answers as its fixtures say (#739)
        # The classifier decides whether a UI-test failure is retried. Three review rounds found three defects
        # in it (a `printf` with two backslashes, the generic `Failing tests:` footer read as an assertion, and
        # the retry's own failure never classified) — none of them visible to any other check, because none of
        # them was a test. This runs the six fixtures; it needs no simulator and takes a second.
        run: bash apps/child-ios/scripts/test-classify-launch-failure.sh

      - name: Each suite's path filter covers what the suite reads (2026-10-24)
        # The build-and-test workflows run only when their paths change, so a path list that misses an
        # input is a suite that silently stops running on the PRs that can break it. The self-test proves
        # each rule fails on a fixture that breaks it.
        run: |
          node scripts/check-ci-paths.mjs --selftest
          node scripts/check-ci-paths.mjs

      - name: CI-cost guardrails - iOS paths, weekly schedules, concurrency and Gradle cache (#613)
        # The cheaper-CI edits are structural contracts: ios-ci pushes main-only with its exact path
        # list, seven schedules are weekly Monday, the nine PR suites keep cancel-in-progress, and the
        # Android job gains setup-gradle pinned by full commit SHA. The self-test proves each rule fails on a fixture that breaks it.
        run: |
          node scripts/check-ci-cost-guardrails.mjs --selftest
          node scripts/check-ci-cost-guardrails.mjs

      - name: up.sh never runs production on the staging profile by name (osra#768)
        # #765 refuses a production run with no AWS_PROFILE. This pins the case it still allowed: a profile
        # that was given, and is the staging one. The check spawns bash (up.sh needs it for `pipefail`) and
        # stubs terraform/aws on PATH, so it measures the guard rather than the runner's toolchain.
        run: |
          node scripts/check-up-production-credential.mjs --selftest
          node scripts/check-up-production-credential.mjs

      - name: Parse every workflow as YAML (the one thing the structural linter cannot do)
        # `check-workflows.mjs` matches text; it cannot tell that a comment lost its `#` and became a
        # bare line. That is exactly what happened to verified-gate.yml on 2026-10-19: the linter
        # passed, GitHub rejected the file, the run failed in 0 s with no jobs, and the gate it was
        # meant to enforce did not exist. A real parser closes that class.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
                  print(f'{f}: YAML OK')
              except Exception as exc:
                  bad = 1
                  print(f'::error file={f}::not valid YAML: {exc}')
          sys.exit(bad)
          PY

      - name: Classifier self-test - a testOnly/debuggable build is not gate evidence (#178)
        # The hardware probe refuses to run rows on a build that is not gate-eligible, and this is the
        # pure decision it uses. The fixtures include real `dumpsys package` output from the Flip4; a
        # regression here would silently turn the refusal back into a PASS on a debug APK.
        shell: pwsh
        run: ./scripts/hardware/classify-build.ps1 -SelfTest

      - name: App-list cadence self-test - set comparison, the 14-16 minute window, the verdict rule (TR-48, #201, #221)
        # The live harness is a phone + API measurement; this step exercises the pure decisions it
        # makes: what is missing/stale/tolerated, whether a gap is inside 14-16 minutes, and that the
        # verdict comes from the last comparison after an observed sync, not from the start (#221 D2).
        # A regression here would either invent a PASS, fail an app installed after the last sync, or
        # fail a phone that had already uploaded the corrected list.
        shell: pwsh
        run: ./scripts/hardware/app-list-cadence.ps1 -SelfTest

      - name: Human pairing timer self-test - step marks, totals and result files (TR-51/52/53)
        # -Human never touches adb and never assigns PASS/FAIL to a person's run. This step proves
        # that the duration arithmetic, the informational verdict and both output files stay intact.
        shell: pwsh
        run: ./scripts/hardware/android-pairing-time.ps1 -Human -SelfTest

      - name: Scenario-family self-tests - the base URL guard, the neutralised defaults, the token file (#668)
        # The helper signs accounts up and erases them, so these cases are the proof of the two rules that
        # must hold before any request is sent: the host guard, and a create that refuses a ruleset whose
        # screen-time defaults survived. The live "delete after create leaves nothing" case is skipped here
        # (this job has no API) and runs in api-image.yml, the job that boots the API against Postgres.
        # The run must PRINT its summary: a step that exits 0 in silence is a gate that did not run (the
        # same trap as the site-design step below, #592). `pass 24` cannot appear on a failed or empty run —
        # the suite is 22 cases, one of them the gated live case — and `fail 0` is asserted beside it because
        # a 25th case that failed would still leave `pass 24` on the summary. Both lines are read from a
        # captured copy, not through the pipe: `grep -q` stops at its match, and the summary is a block, so
        # it can close the pipe on `tee` before the reporter finishes (SIGPIPE, exit 141, and `pipefail`
        # fails the step). The staging-prereqs step below captures `out` for the same reason.
        run: |
          set -o pipefail
          out=$(node --test scripts/hardware/scenario-family.test.mjs 2>&1 | tee /dev/stderr)
          printf '%s\n' "$out" | grep -q 'pass 25$'
          printf '%s\n' "$out" | grep -q 'fail 0$'

      - name: Scenario runner Pester and no-device dry run (#667)
        # Every ADB, lease and HTTP call is behind the fake boundary. The Pester count must be nonempty
        # and the CLI must print its dry-run table and leave a result file: exit 0 with no tests or no
        # report would be a gate that did not run. No real lease, backend, account or device is touched.
        shell: pwsh
        env:
          FAKE_SCREENSHOT: ${{ github.workspace }}/scripts/hardware/tests/fixtures/rgb.png
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          $env:PATH = (Join-Path $env:GITHUB_WORKSPACE "scripts/hardware/tests/fixtures/bin") + [IO.Path]::PathSeparator + $env:PATH
          $env:FAKE_ADB_LOG = Join-Path $env:RUNNER_TEMP "scenario-adb.jsonl"
          $tests = Invoke-Pester -Path @(
            "scripts/hardware/tests/Scenario.Validation.Tests.ps1",
            "scripts/hardware/tests/Scenario.Preflight.Tests.ps1",
            "scripts/hardware/tests/Scenario.Evidence.Tests.ps1",
            "scripts/hardware/tests/Scenario.Run.Tests.ps1",
            "scripts/hardware/tests/Scenario.DryRun.Tests.ps1"
          ) -PassThru
          if ($tests.TotalCount -lt 117 -or $tests.FailedCount -ne 0) { throw "scenario Pester: $($tests.PassedCount) passed, $($tests.FailedCount) failed, $($tests.TotalCount) total" }
          # The Pester rows remove the fake env between cases, so the CLI sets its own image here.
          $env:FAKE_SCREENSHOT = Join-Path $env:GITHUB_WORKSPACE "scripts/hardware/tests/fixtures/rgb.png"
          $out = Join-Path $env:RUNNER_TEMP "scenario-evidence"
          $printed = & pwsh -NoProfile -File ./scripts/hardware/scenario.ps1 -DryRun -Scenario SC-0.1 -Serial R5CW116Y6GF -Out $out 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $printed
          if ($code -ne 0) {
            Get-ChildItem -Path $out -Recurse -Filter result.json |
              ForEach-Object { Write-Host (Get-Content -LiteralPath $_.FullName -Raw) }
            throw "scenario dry run exited $code"
          }
          if ($printed -notmatch "PASS \(DRY RUN\)" -or $printed -notmatch "SC-0.1") { throw "scenario dry run printed no PASS (DRY RUN) table" }
          if (-not (Get-ChildItem -Path $out -Recurse -Filter result.md)) { throw "scenario dry run wrote no result.md" }

      - name: A PR may only change what its title says it changes
        # Added after 2026-10-19: a squash built on a pre-#218 base produced a 24-file diff that would
        # have reverted #218 while every test stayed green (the tests proved the old code worked).
        # This check reads the intent from the title and the reality from the diff.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          node scripts/check-pr-diff-scope.mjs --title "$PR_TITLE" --base "origin/${{ github.base_ref }}" --head "${{ github.event.pull_request.head.sha }}"

      - name: Diff-scope self-test
        run: node scripts/check-pr-diff-scope.mjs --selftest

      - name: Probe-integrity self-test - a wrapped call is compared, a deleted one is REMOVED (#310)
        # The gate reads assertion names across line breaks. Before #310 a `check(` whose title opened
        # on the next line was invisible: it counted as neither added nor removed, so deleting it passed
        # (132 of 141 call sites seen on 68dd367). The fixtures include that exact deleted wrapped call;
        # the CLI case must exit 1. Mutant: the old per-line matcher makes it exit 0 and the test fails.
        run: node scripts/check-probe-integrity.mjs --selftest

      - name: Docs-links self-test - three shapes that used to pass silently (#324)
        # The gate behind every PR's "0 broken link(s)" line. Before #324 an anchor into a
        # heading-less file, a reference-style link (`[label][ref]` + `[ref]: path`) and an
        # intra-file anchor (`[x](#section)`) were all invisible, so a stale documentation index
        # produced a lower number in a line that reads "0 broken" rather than a red run.
        # Mutants, one per rule: restore the `headings.size > 0` guard, drop the reference scan,
        # drop the intra-file branch - each makes one fixture fail.
        run: |
          node scripts/check-docs-links.mjs --selftest
          node scripts/check-docs-links.mjs

      - name: Staging-prereqs self-test - one fixture per rule, and an environment failure is not a finding (#337)
        # The script answers "will this clone be able to run a session?" before one spends: tfvars present,
        # publish role resolvable, api_image tag in ECR. The fixtures cover each rule and the classifier that
        # separates "the role does not exist" from "aws could not be asked".
        # The last line is the flag guard: a mistyped flag must never fall through to the real AWS check.
        # Exit 2 alone is NOT proof — with no credentials the real check also exits 2, so the step would
        # stay green with the guard deleted. It must also see the guard's own message (#347 review).
        run: |
          node scripts/check-staging-prereqs.mjs --selftest
          code=0; out=$(node scripts/check-staging-prereqs.mjs --self-test 2>&1) || code=$?
          if [ "$code" -ne 2 ] || ! printf '%s' "$out" | grep -q "unrecognised argument"; then
            echo "an unknown flag must exit 2 with 'unrecognised argument', got $code: $out"; exit 1
          fi

      - name: osratech.com uses the design tokens and nothing else (ADR-0038, roadmap 3.19)
        # The website is one surface of the design language: its colours and radii are the values of
        # docs/design/tokens.json under the same names, in both themes; its font is the bundled IBM Plex;
        # nothing is fetched from a third party; an Arabic page is dir="rtl" and the sheet names no
        # physical side. The self-test runs first: 21 cases, one per rule and per way of breaking it
        # (the pre-3.19 indigo link colour is the drifted-token fixture), two of them running the script as
        # a command. Each run must also PRINT its summary line: a script that exits 0 in silence is a gate
        # that did not run, which is what it did on Windows before the #592 review.
        run: |
          set -o pipefail
          node scripts/check-site-design.mjs --selftest | tee /dev/stderr | grep -q '^site design self-test: [0-9]* cases pass$'
          node scripts/check-site-design.mjs | tee /dev/stderr | grep -q '^site design: .* match docs/design/tokens.json'
          # The marketing pages (home, download, guide, EN and AR) are generated by scripts/site/marketing/build.mjs
          # from its word files; a hand edit to the output, or a word change not rebuilt, fails here.
          node scripts/site/marketing/build.mjs --check | tee /dev/stderr | grep -q '^marketing pages: [0-9]* page(s) match their sources$'
          # #728: the child agent's Compose theme is generated from the same tokens file. A token changed without
          # regenerating OsraTokens.kt is a red job here rather than a wrong colour on a child's phone — the
          # generator's own summary line is what is matched, so a silent exit cannot pass.
          node scripts/gen-android-tokens.mjs --check | tee /dev/stderr | grep -q '^gen-android-tokens: up to date$'

      - name: No conflict markers in any tracked file
        # A conflicted merge that is staged and committed leaves `<<<<<<<` in the tree, and no test reads
        # documentation, so every suite stays green. The self-test proves the rule fires on a real pair
        # and stays quiet on a setext heading or prose about merges.
        run: |
          node scripts/check-no-conflict-markers.mjs --selftest
          node scripts/check-no-conflict-markers.mjs

      - name: No Google service-account or PEM key material in any tracked file
        # Name rules miss a renamed file (.gitignore covers google-services*.json and friends, not
        # backup/service.json), and a credential in a public repo stays in every clone and fork.
        run: |
          node scripts/check-no-service-account-keys.mjs --selftest
          node scripts/check-no-service-account-keys.mjs

      - name: No old user-visible branding (issue #608)
        # The product surface renamed to OSRA: the export filename, the support domain/email, the
        # desktop data folder, and the Windows test-certificate subject. This guard fails on any
        # tracked occurrence of the old user-visible forms while allowing the internal identifiers
        # (namespaces, packages, project/assembly names) and the one-time migration's reference to
        # the legacy folder. The self-test runs first, from throwaway fixtures, so a guard that is
        # silent because it is broken cannot pass.
        run: |
          node scripts/check-user-visible-brand.mjs --selftest
          node scripts/check-user-visible-brand.mjs

      - name: verified-gate reads a verification only from the agent account, plus Ahmed's own "— Ahmed"
        # The repository is public and, from 2026-10-23, has a second member working with his own Claude
        # agent: a comment from any other account that ends "— Claude" must never verify a PR. From
        # 2026-11-13 (#617) Ahmed's account counts for one thing, a Verified-sha signed "— Ahmed", and a
        # "— Ahmed" from the agent account never counts. The self-test proves the check fails on twelve
        # broken gates (an edited comment from his account among them), structurally and under jq.
        run: |
          node scripts/check-verified-gate-signers.mjs --selftest
          node scripts/check-verified-gate-signers.mjs

      - name: Carry-forward keeps a signature only when no hand-edited merge followed it (#357, #358 review)
        # `git patch-id` hashes hunks with their context lines, so the old comparison refused a correctly
        # folded merge when main edited a line near the PR's hunks (#349: default context DIFFER, -U0
        # EQUAL). With context gone, position is not compared, so every merge after the signature must be
        # a clean merge of its parents. The fixtures are real git repositories. Every rule that can change
        # the answer has a fixture that fails without it: the -U0 comparison, the merge-only rule, the
        # ancestor rule, the merge base, and rule (c)'s conflict, tree and parent-count checks (case 6 pins
        # the gap -U0 alone opens: a hand rewrite that moves the PR's line into another function, with equal
        # -U0 ids). The patch comparison is kept as a second layer; no fixture isolates it any more, because
        # a clean fold cannot change it.
        run: node scripts/verified-gate-carry.mjs --selftest

      - name: Mesh merge policy never lets an author, or the author's model family, verify alone (AGENTS.md §6.6)
        # Maintainer 2026-11-13 15:42Z (#617, #719): every PR needs a signer who is not the author and, from R2
        # up, from another model family; R3 needs a second key (Ahmed, Fable or Antigravity); Bureau lines when the diff
        # needs them. Each rule has a case that fails without it, including a label trying to lower the tier.
        run: |
          node scripts/verified-gate-policy.mjs --selftest | tee /dev/stderr | grep -q '^verified-gate policy self-test: [0-9]* cases pass$'

      - name: Check documentation links resolve
        # A documentation set is only navigable if its links work; a moved guide rots the index
        # silently. Also catches links to files that were never committed.
        run: node scripts/check-docs-links.mjs

      - name: No PIN-shaped literal in docs, scripts or workflows (#151)
        # The repository is public and the test family's app PIN sat in five places for days; that PIN
        # opens "Remove protection" and "stop ring" on the paired phone. The self-test runs first so a
        # guard that is silent because it is broken cannot pass: eight fixtures, each a decision (a value
        # before the word, a value after it, the refused 0000 default, a placeholder, and four negatives).
        run: |
          node scripts/check-no-pins.mjs --selftest
          node scripts/check-no-pins.mjs

      - name: Redis can lose revocation state — the ElastiCache settings that prevent it (ADR-0032)
        # The API stores every revocation in Postgres and treats Redis as a cache, but two provider
        # defaults still decide whether a key survives: `maxmemory-policy` (default allkeys-lru evicts
        # the version/token/device revocation keys, and an evicted key reads as "nothing was revoked")
        # and `snapshot_retention_limit` (default 0, so a restart returns an empty cache). This reads
        # infra/terraform/env/elasticache.tf with comments stripped, so a sentence about the policy
        # cannot stand in for the setting. Mutants, one per rule: drop the parameter block, switch it
        # to allkeys-lru, or set retention back to 0 — each fails a named fixture in the self-test.
        run: |
          node scripts/check-redis-durability.mjs --selftest
          node scripts/check-redis-durability.mjs

      - name: A production task definition is a release configuration, and every variable the API reads is classified (gate #637)
        # scripts/check-production-taskdef.mjs reads what `aws ecs describe-task-definition` prints and fails on a
        # development, staging or test switch, a secret passed as a plain value, a moving image tag, a missing
        # required setting or a variable nobody classified. CI has no AWS access, so two things run here: the
        # self-test (one fixture per rule, each differing from a clean one by one thing and expected to raise
        # exactly that finding), and `--source`, which fails when the API starts reading a variable the script
        # has no decision for. Mutant for `--source`: add `process.env.NEW_SWITCH` anywhere under services/api/src.
        run: |
          node scripts/check-production-taskdef.mjs --selftest
          node scripts/check-production-taskdef.mjs --source
