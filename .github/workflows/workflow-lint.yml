name: workflow-lint

# Guards against the class of failure that took CI down for a day (issue #37): `ci.yml` contained a
# step with both `uses:` and `run:`, YAML parsers accept it, GitHub rejects the whole file, and
# **every job was skipped** — so `main` had no CI signal at all.
#
# This lives in its own file on purpose: it still runs when another workflow file is invalid.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` (review N2): this workflow reads the PR title — the diff-scope check's declared kind comes
    # from it — so a retitle must re-run it. Without this a fixed title left the red run of the old one
    # standing, which is what happened to #279's `chore(process)` title.
    types: [opened, synchronize, reopened, edited]

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Moved here from ci.yml (review N2): this gate reads the PR title, and `workflow-lint` runs on
      # `edited`, so a retitle re-checks it in ~20 s instead of rebuilding the Android app.
      - name: A code change carries a changelog fragment
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-changelog-fragment.mjs --base "origin/${{ github.base_ref }}"

      - name: Check .github/workflows for schema traps and gates that cannot fail
        # --strict: warnings (failure-swallowing steps) also fail the gate. Remove the flag if a
        # deliberate `|| true` is ever needed; do not add one without saying why in the PR.
        run: node scripts/check-workflows.mjs --strict

      - name: Parse every workflow as YAML (the one thing the structural linter cannot do)
        # `check-workflows.mjs` matches text; it cannot tell that a comment lost its `#` and became a
        # bare line. That is exactly what happened to verified-gate.yml on 2026-10-19: the linter
        # passed, GitHub rejected the file, the run failed in 0 s with no jobs, and the gate it was
        # meant to enforce did not exist. A real parser closes that class.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
                  print(f'{f}: YAML OK')
              except Exception as exc:
                  bad = 1
                  print(f'::error file={f}::not valid YAML: {exc}')
          sys.exit(bad)
          PY

      - name: Classifier self-test - a testOnly/debuggable build is not gate evidence (#178)
        # The hardware probe refuses to run rows on a build that is not gate-eligible, and this is the
        # pure decision it uses. The fixtures include real `dumpsys package` output from the Flip4; a
        # regression here would silently turn the refusal back into a PASS on a debug APK.
        shell: pwsh
        run: ./scripts/hardware/classify-build.ps1 -SelfTest

      - name: App-list cadence self-test - set comparison, the 14-16 minute window, the verdict rule (TR-48, #201, #221)
        # The live harness is a phone + API measurement; this step exercises the pure decisions it
        # makes: what is missing/stale/tolerated, whether a gap is inside 14-16 minutes, and that the
        # verdict comes from the last comparison after an observed sync, not from the start (#221 D2).
        # A regression here would either invent a PASS, fail an app installed after the last sync, or
        # fail a phone that had already uploaded the corrected list.
        shell: pwsh
        run: ./scripts/hardware/app-list-cadence.ps1 -SelfTest

      - name: Human pairing timer self-test - step marks, totals and result files (TR-51/52/53)
        # -Human never touches adb and never assigns PASS/FAIL to a person's run. This step proves
        # that the duration arithmetic, the informational verdict and both output files stay intact.
        shell: pwsh
        run: ./scripts/hardware/android-pairing-time.ps1 -Human -SelfTest

      - name: A PR may only change what its title says it changes
        # Added after 2026-10-19: a squash built on a pre-#218 base produced a 24-file diff that would
        # have reverted #218 while every test stayed green (the tests proved the old code worked).
        # This check reads the intent from the title and the reality from the diff.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          node scripts/check-pr-diff-scope.mjs --title "$PR_TITLE" --base "origin/${{ github.base_ref }}" --head "${{ github.event.pull_request.head.sha }}"

      - name: Diff-scope self-test
        run: node scripts/check-pr-diff-scope.mjs --selftest

      - name: Probe-integrity self-test - a wrapped call is compared, a deleted one is REMOVED (#310)
        # The gate reads assertion names across line breaks. Before #310 a `check(` whose title opened
        # on the next line was invisible: it counted as neither added nor removed, so deleting it passed
        # (132 of 141 call sites seen on 68dd367). The fixtures include that exact deleted wrapped call;
        # the CLI case must exit 1. Mutant: the old per-line matcher makes it exit 0 and the test fails.
        run: node scripts/check-probe-integrity.mjs --selftest

      - name: Docs-links self-test - three shapes that used to pass silently (#324)
        # The gate behind every PR's "0 broken link(s)" line. Before #324 an anchor into a
        # heading-less file, a reference-style link (`[label][ref]` + `[ref]: path`) and an
        # intra-file anchor (`[x](#section)`) were all invisible, so a stale documentation index
        # produced a lower number in a line that reads "0 broken" rather than a red run.
        # Mutants, one per rule: restore the `headings.size > 0` guard, drop the reference scan,
        # drop the intra-file branch - each makes one fixture fail.
        run: |
          node scripts/check-docs-links.mjs --selftest
          node scripts/check-docs-links.mjs

      - name: No conflict markers in any tracked file
        # A conflicted merge that is staged and committed leaves `<<<<<<<` in the tree, and no test reads
        # documentation, so every suite stays green. The self-test proves the rule fires on a real pair
        # and stays quiet on a setext heading or prose about merges.
        run: |
          node scripts/check-no-conflict-markers.mjs --selftest
          node scripts/check-no-conflict-markers.mjs

      - name: No Google service-account or PEM key material in any tracked file
        # Name rules miss a renamed file (.gitignore covers google-services*.json and friends, not
        # backup/service.json), and a credential in a public repo stays in every clone and fork.
        run: |
          node scripts/check-no-service-account-keys.mjs --selftest
          node scripts/check-no-service-account-keys.mjs

      - name: verified-gate reads a verification only from the agent account
        # The repository is public and, from 2026-10-23, has a second member working with his own Claude
        # agent: a comment from any other account that ends "— Claude" must never verify a PR. The
        # self-test proves the check fails on the pre-fix filter, structurally and under jq.
        run: |
          node scripts/check-verified-gate-signers.mjs --selftest
          node scripts/check-verified-gate-signers.mjs

      - name: Check documentation links resolve
        # A documentation set is only navigable if its links work; a moved guide rots the index
        # silently. Also catches links to files that were never committed.
        run: node scripts/check-docs-links.mjs

      - name: Redis can lose revocation state — the ElastiCache settings that prevent it (ADR-0032)
        # The API stores every revocation in Postgres and treats Redis as a cache, but two provider
        # defaults still decide whether a key survives: `maxmemory-policy` (default allkeys-lru evicts
        # the version/token/device revocation keys, and an evicted key reads as "nothing was revoked")
        # and `snapshot_retention_limit` (default 0, so a restart returns an empty cache). This reads
        # infra/terraform/env/elasticache.tf with comments stripped, so a sentence about the policy
        # cannot stand in for the setting. Mutants, one per rule: drop the parameter block, switch it
        # to allkeys-lru, or set retention back to 0 — each fails a named fixture in the self-test.
        run: |
          node scripts/check-redis-durability.mjs --selftest
          node scripts/check-redis-durability.mjs
