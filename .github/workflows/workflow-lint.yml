name: workflow-lint

# Guards against the class of failure that took CI down for a day (issue #37): `ci.yml` contained a
# step with both `uses:` and `run:`, YAML parsers accept it, GitHub rejects the whole file, and
# **every job was skipped** — so `main` had no CI signal at all.
#
# This lives in its own file on purpose: it still runs when another workflow file is invalid.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check .github/workflows for schema traps and gates that cannot fail
        # --strict: warnings (failure-swallowing steps) also fail the gate. Remove the flag if a
        # deliberate `|| true` is ever needed; do not add one without saying why in the PR.
        run: node scripts/check-workflows.mjs --strict

      - name: Parse every workflow as YAML (the one thing the structural linter cannot do)
        # `check-workflows.mjs` matches text; it cannot tell that a comment lost its `#` and became a
        # bare line. That is exactly what happened to verified-gate.yml on 2026-10-19: the linter
        # passed, GitHub rejected the file, the run failed in 0 s with no jobs, and the gate it was
        # meant to enforce did not exist. A real parser closes that class.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
                  print(f'{f}: YAML OK')
              except Exception as exc:
                  bad = 1
                  print(f'::error file={f}::not valid YAML: {exc}')
          sys.exit(bad)
          PY

      - name: Classifier self-test - a testOnly/debuggable build is not gate evidence (#178)
        # The hardware probe refuses to run rows on a build that is not gate-eligible, and this is the
        # pure decision it uses. The fixtures include real `dumpsys package` output from the Flip4; a
        # regression here would silently turn the refusal back into a PASS on a debug APK.
        shell: pwsh
        run: ./scripts/hardware/classify-build.ps1 -SelfTest

      - name: App-list cadence self-test - set comparison, the 14-16 minute window, the verdict rule (TR-48, #201, #221)
        # The live harness is a phone + API measurement; this step exercises the pure decisions it
        # makes: what is missing/stale/tolerated, whether a gap is inside 14-16 minutes, and that the
        # verdict comes from the last comparison after an observed sync, not from the start (#221 D2).
        # A regression here would either invent a PASS, fail an app installed after the last sync, or
        # fail a phone that had already uploaded the corrected list.
        shell: pwsh
        run: ./scripts/hardware/app-list-cadence.ps1 -SelfTest

      - name: Human pairing timer self-test - step marks, totals and result files (TR-51/52/53)
        # -Human never touches adb and never assigns PASS/FAIL to a person's run. This step proves
        # that the duration arithmetic, the informational verdict and both output files stay intact.
        shell: pwsh
        run: ./scripts/hardware/android-pairing-time.ps1 -Human -SelfTest

      - name: A PR may only change what its title says it changes
        # Added after 2026-10-19: a squash built on a pre-#218 base produced a 24-file diff that would
        # have reverted #218 while every test stayed green (the tests proved the old code worked).
        # This check reads the intent from the title and the reality from the diff.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          node scripts/check-pr-diff-scope.mjs --title "$PR_TITLE" --base "origin/${{ github.base_ref }}" --head "${{ github.event.pull_request.head.sha }}"

      - name: Diff-scope self-test
        run: node scripts/check-pr-diff-scope.mjs --selftest

      - name: Check documentation links resolve
        # A documentation set is only navigable if its links work; a moved guide rots the index
        # silently. Also catches links to files that were never committed.
        run: node scripts/check-docs-links.mjs
