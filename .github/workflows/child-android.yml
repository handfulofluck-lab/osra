name: Child Android

# The child agent (Android JVM unit tests, no emulator). Until 2026-10-24 this was the `child-android` job of
# ci.yml and ran on every pull request; now it runs when the agent changes, on main when it changes, and
# nightly on main whatever changed. `scripts/check-merged-manifest-gate.mjs` runs from the repository root in
# this job, so a change to it runs the job too. `scripts/check-ci-paths.mjs` keeps the two lists identical,
# makes sure they name this file, and fails if a `node scripts/…` step here is not covered by them.
on:
  push:
    branches: [main]
    paths:
      - "apps/child-android/**"
      - "scripts/check-merged-manifest-gate.mjs"
      - ".github/workflows/child-android.yml"
  pull_request:
    paths:
      - "apps/child-android/**"
      - "scripts/check-merged-manifest-gate.mjs"
      - ".github/workflows/child-android.yml"
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

concurrency:
  group: child-android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# **Do not rename this file.** Play's versionCode comes from this workflow's `run_number`; renaming or
# recreating the workflow restarts the counter at 1, and Play then refuses every upload until the new count
# passes the old one again. See the `OSRA_VERSION_CODE` line on the build step.

jobs:
  child-android:
    # NOTE: this job used `macos-13`, which GitHub has since retired — the job sat "queued" forever
    # and never ran, so the Android suite and the assemble guard were never actually exercised
    # in CI (same class as #37: a gate that looks configured but never executes). Ubuntu runners ship
    # the Android SDK, and nothing here needs macOS.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/child-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Plan 1.8: same upload keystore as the parent app, materialised from the secret when present.
      # The build refuses a signed release without google-services.json (#409), and refuses a half-configured
      # one (any of the four OSRA_UPLOAD_* variables without the rest). So the keystore and its three passwords
      # reach Gradle together, and only when the Firebase config is there too; otherwise the release builds with
      # the debug key and says so, instead of every Android job dying at configuration. Neither guard changes.
      - name: Materialise upload keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.OSRA_UPLOAD_KEYSTORE_B64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.CHILD_GOOGLE_SERVICES_JSON_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OSRA_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OSRA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OSRA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "OSRA_UPLOAD_KEYSTORE_B64 not set — release APK will use the debug key (by design)"
            exit 0
          fi
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::warning::CHILD_GOOGLE_SERVICES_JSON_B64 is not set, so this release APK is debug-signed. A signed release needs the Firebase config (#409); set the secret to sign."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/upload.jks
          {
            echo "OSRA_UPLOAD_KEYSTORE=app/upload.jks"
            echo "OSRA_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "OSRA_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "OSRA_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "upload keystore materialised"
      # #409: the moment a release keystore exists, the Gradle build refuses a signed release with no
      # google-services.json. Materialise it here, or every release job fails with that sentence.
      - name: Materialise Firebase config (if configured)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.CHILD_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "CHILD_GOOGLE_SERVICES_JSON_B64 not set - a config-less release build is refused once a keystore exists (never commit google-services.json, #317)"
            exit 0
          fi
          # The job's working-directory is apps/child-android and the module is app/ (#412 review).
          echo "$GOOGLE_SERVICES_B64" | base64 -d > app/google-services.json
          echo "google-services.json materialised"
      - name: Unit tests & build (JVM + debug APK + minified release APK)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # G4 of the customer guide: the server a store build pairs against. A repository variable, the same
          # one the parent app reads, so one setting describes a deployment for both apps. Unset keeps today's
          # behaviour (the child types an address); set it to the production https URL before a store build.
          OSRA_API_BASE: ${{ vars.OSRA_API_BASE }}
          # Play refuses a versionCode it already has, so the number rises with every run. The workflow's own
          # run number only ever increases, and each app is published by one workflow.
          OSRA_VERSION_CODE: ${{ github.run_number }}
        # assembleRelease proves the shrunk (R8), release-signed configuration builds; signing material
        # comes from the keystore step above when it is complete and falls back to the debug key. Both release flavours
        # are built because #170's gate asserts `android:testOnly` is absent from each release merge.
        run: |
          case "$OSRA_API_BASE" in
            "") echo "OSRA_API_BASE not set: a release build asks the child for the server address" ;;
            https://*) echo "built-in server: $OSRA_API_BASE" ;;
            *) echo "::error::OSRA_API_BASE must start with https://"; exit 1 ;;
          esac
          ./gradlew testPlayDebugUnitTest testFullDebugUnitTest assemblePlayDebug assembleFullDebug assemblePlayRelease assembleFullRelease bundlePlayRelease --console=plain
      # ADR-0021's gate asserts the *merged* manifest (where a dependency's permissions arrive), so it
      # only means something if the unit tests above actually ran it. The test skips with a loud message
      # when the artefact is missing — that is what an IDE run needs and what CI must never accept — so
      # this step fails the job on a skip, a failure, or a named assertion that disappeared.
      # Play refuses a debug-signed bundle at upload, and a green job used to hand one over without a word
      # if the upload-key secrets went missing (#534 review). With the key configured, the bundle's signer
      # must be the upload certificate; without it, the job says the bundle is not uploadable.
      - name: The Play bundle is signed with the upload key when one is configured
        env:
          HAS_UPLOAD_KEY: ${{ secrets.OSRA_UPLOAD_KEYSTORE_B64 != '' }}
        run: |
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          [ -f "$AAB" ] || { echo "::error::$AAB is missing"; exit 1; }
          CERT=$(keytool -printcert -jarfile "$AAB")
          OWNER=$(grep -m1 '^Owner:' <<<"$CERT") || { echo "::error::$AAB carries no signature"; exit 1; }
          echo "bundle signer: $OWNER"
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            grep -q 'CN=OSRA Upload Key' <<<"$OWNER" \
              || { echo "::error::the Play bundle is not signed with the upload key"; exit 1; }
            echo "signed with the upload key"
          else
            echo "::warning::no upload key configured: this bundle is debug-signed and Play will refuse it"
          fi
      - name: Merged-manifest gate ran and did not skip (ADR-0021)
        working-directory: .
        run: node scripts/check-merged-manifest-gate.mjs
      # Each guard ends in `|| { …; exit 1; }`. Until #361 they were `grep -q … && echo …`, and bash exempts every
      # command of an `&&` list but the last from `-e`, so a release APK targeting 34 passed this step; so did a
      # path that no longer existed after the flavours landed (1.8), which is why it read no APK at all.
      - name: Release manifest is HTTPS-only and targets 35
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          # Both release flavours (1.8): Gradle writes <flavour>/release/app-<flavour>-release.apk.
          for FLAVOUR in play full; do
            APK="app/build/outputs/apk/$FLAVOUR/release/app-$FLAVOUR-release.apk"
            [ -f "$APK" ] || { echo "::error::$APK is missing, so the release checks cannot run"; exit 1; }
            # Captured, not piped: `grep -q` stops at the first match, and with pipefail on, aapt2 would then die of SIGPIPE.
            BADGING=$("$AAPT" dump badging "$APK")
            grep -q "targetSdkVersion:'35'" <<<"$BADGING" || { echo "::error::$APK does not target 35"; exit 1; }
            echo "$FLAVOUR release: targetSdk 35"
            # ADR-0039 R1: each flavour must carry its own application id. A Full APK with the Play id would be
            # refused by the store, and a Play APK with the Full id would install beside it on a child's phone.
            if [ "$FLAVOUR" = "full" ]; then WANT_PKG="com.osratech.child.full"; else WANT_PKG="com.osratech.child"; fi
            grep -q "package: name='$WANT_PKG'" <<<"$BADGING"               || { echo "::error::$APK is $(grep -o "package: name='[^']*'" <<<"$BADGING"), not $WANT_PKG"; exit 1; }
            echo "$FLAVOUR release: package $WANT_PKG"
            # Play 5.2: the number Play receives must be this run's, or a second upload is refused. Asserting
            # it on the built artefact is the only way CI can prove the wiring, rather than trusting Gradle.
            # `aapt2 dump badging` prints the code on the `package:` line as `versionCode='528'` — with an
            # equals sign. The colon form belongs to lines like `targetSdkVersion:'35'`, so a colon pattern
            # here can never match and the job goes red on a correct build (#591 review).
            grep -q "versionCode='${{ github.run_number }}'" <<<"$BADGING"               || { echo "::error::$APK carries $(grep -o "versionCode='[0-9]*'" <<<"$BADGING"), not ${{ github.run_number }}"; exit 1; }
            echo "$FLAVOUR release: versionCode ${{ github.run_number }}"
          done
          # The release config is the one in src/main (src/debug overrides it for the debug build only).
          grep -q 'cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml \
            || { echo "::error::release cleartext is not off"; exit 1; }
          echo "release cleartext off"
          grep -q 'cleartextTrafficPermitted="true"' app/src/debug/res/xml/network_security_config.xml \
            || { echo "::error::debug cleartext is not on"; exit 1; }
          echo "debug cleartext on (dev servers)"
      # RELEASING.md R4 counts on these artefacts, so an empty upload fails the job instead of warning.
      - uses: actions/upload-artifact@v4
        with:
          name: child-android-apks
          path: |
            apps/child-android/app/build/outputs/apk/*/debug/*.apk
            apps/child-android/app/build/outputs/apk/*/release/*.apk
          retention-days: 14
          if-no-files-found: error
      # Play takes an app bundle, not an APK. Only the play flavour goes to the store (the full build is
      # sideloaded, ADR-0021). Signed with the upload key when the secrets exist, else the debug key.
      - uses: actions/upload-artifact@v4
        with:
          name: child-android-play-release-aab
          path: apps/child-android/app/build/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 14
          if-no-files-found: error
