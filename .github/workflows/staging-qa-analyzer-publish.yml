name: Publish staging QA analyzer image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-qa-analyzer-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'handfulofluck-lab/osra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANALYZER_REPOSITORY: ${{ secrets.AWS_STAGING_QA_ANALYZER_REPOSITORY }}
      PUBLISH_ROLE: ${{ secrets.AWS_STAGING_QA_ANALYZER_PUBLISH_ROLE_ARN }}
      ECR_REGION: eu-north-1
      ECR_REPOSITORY_NAME: osra-staging/qa-ai-engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check protected source and staging target
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]; then
            echo "::error::The analyzer image must build the exact main commit that started this run."
            exit 1
          fi
          if ! test -f services/ai-engine/staging_qa.py; then
            echo "::error::The reviewed staging QA adapter must be on main before publishing."
            exit 1
          fi
          if ! [[ "$ANALYZER_REPOSITORY" =~ ^([0-9]{12})\.dkr\.ecr\.eu-north-1\.amazonaws\.com/osra-staging/qa-ai-engine$ ]]; then
            echo "::error::The staging analyzer repository reference is absent or invalid."
            exit 1
          fi
          account="${BASH_REMATCH[1]}"
          printf '::add-mask::%s\n' "$account"
          if [[ "$PUBLISH_ROLE" != "arn:aws:iam::${account}:role/osra-staging-qa-analyzer-publish" ]]; then
            echo "::error::The dedicated staging analyzer publisher must match the target registry account."
            exit 1
          fi
          printf 'ANALYZER_ACCOUNT=%s\n' "$account" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.PUBLISH_ROLE }}
          aws-region: ${{ env.ECR_REGION }}
          allowed-account-ids: ${{ env.ANALYZER_ACCOUNT }}
          mask-aws-account-id: true
          role-session-name: ${{ github.run_id }}

      - name: Log in to staging ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$ECR_REGION" \
            | docker login --username AWS --password-stdin "${ANALYZER_REPOSITORY%%/*}"

      - name: Look up the immutable commit tag
        id: existing
        run: |
          set -euo pipefail
          errors="$(mktemp)"
          trap 'rm -f "$errors"' EXIT
          if digest="$(aws ecr describe-images --region "$ECR_REGION" --repository-name "$ECR_REPOSITORY_NAME" \
              --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>"$errors")"; then
            if ! [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::ECR returned an invalid analyzer image digest."
              exit 1
            fi
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          elif ! grep -q '(ImageNotFoundException)' "$errors"; then
            echo "::error::Could not check the staging analyzer commit tag in ECR."
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push the staging analyzer
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/ai-engine
          file: services/ai-engine/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ANALYZER_REPOSITORY }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify the ECR digest, architecture and source revision
        env:
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::The publisher did not return a valid image digest."
            exit 1
          fi
          registered="$(aws ecr describe-images --region "$ECR_REGION" --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          if [[ "$registered" != "$IMAGE_DIGEST" ]]; then
            echo "::error::The registry digest does not match the publisher receipt."
            exit 1
          fi
          docker buildx imagetools inspect --format '{{json .Image}}' "$ANALYZER_REPOSITORY@$IMAGE_DIGEST" \
            | jq -e --arg revision "$GITHUB_SHA" \
              '.os == "linux" and .architecture == "amd64" and .config.Labels["org.opencontainers.image.revision"] == $revision' >/dev/null
          printf 'Staging QA analyzer image\n\n- Commit: `%s`\n- Digest: `%s`\n- Platform: `linux/amd64`\n' \
            "$GITHUB_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
