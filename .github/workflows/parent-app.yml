name: Parent app

# The Flutter parent app. Until 2026-10-24 this was the `parent-app` job of ci.yml and ran on every pull
# request; now it runs when the app changes, on main when it changes, and nightly on main whatever changed
# (pub dependencies move under us, and that must show up on main, not on the next unrelated PR). Flutter
# itself is pinned in both setup steps below since stable 3.50.0 (2026-11-11); raising the pin is a PR.
# One file outside `apps/parent-app/` is read: the alert-category parity test (#344) reads the server's
# category list, so a change to it must run this suite. `scripts/check-ci-paths.mjs` keeps the two lists
# identical, makes sure they name this file, and fails when a test starts reading another outside file.
on:
  push:
    branches: [main]
    paths:
      - "apps/parent-app/**"
      - "services/api/src/routes/alerts.ts"
      - ".github/workflows/parent-app.yml"
  pull_request:
    paths:
      - "apps/parent-app/**"
      - "services/api/src/routes/alerts.ts"
      - ".github/workflows/parent-app.yml"
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

# A push to main gets a group of its own, so it is never cancelled and never replaced while it waits.
# `ios-scope` decides from that push's own `before..HEAD`, so a cancelled push's iOS inputs would not be
# seen again until the nightly run: on 2026-10-24 the merge of #354 cancelled the run for #362's merge,
# which had changed this file, and its own diff skipped iOS. A pull request diffs the whole PR against
# its base on every run, so there a newer run covers the older one and cancelling it is safe.
concurrency:
  group: parent-app-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  parent-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parent-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned (2026-11-11): stable 3.50.0 deprecates `package:flutter/material.dart` in favour of
          # `package:material_ui`, and `flutter analyze` fails on the resulting infos in every file. The
          # move to material_ui is its own change; until it lands, CI and release builds stay on the last
          # stable that built main green (run 43083839765). Raise this together with that migration.
          flutter-version: 3.47.9
          cache: true
      # `firebase_messaging` has no Swift Package Manager support yet (Flutter says so in its own
      # warning), and mixing it into an SPM project fails with "Include of non-modular header inside
      # framework module". So this job resolves plugins through CocoaPods instead: the Flutter
      # default, and the only path the Firebase plugins support today.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Store-readiness gate: a release build must compile, shrink and carry INTERNET + the Maps
      # key placeholder. The Maps key is a repository secret (blank is tolerated for the build;
      # the map simply renders empty). Signing: with OSRA_UPLOAD_KEYSTORE_B64 set this produces an
      # upload-key-signed AAB; without it the debug key is used and the job still proves the build.
      # NOTE: the `secrets` context is NOT available in a step `if:` — GitHub rejects the whole
      # workflow file ("Unrecognized named-value: 'secrets'") and zero jobs run, which is exactly
      # how the first push of this PR failed. Decide inside the run body instead.
      # The upload key is used only when the Firebase config is there too: app/build.gradle.kts refuses a
      # signed release without google-services.json (#400), so a keystore with no PARENT_GOOGLE_SERVICES_JSON_B64
      # turned every run red, main included, from 7 Nov. Without the config the build keeps the debug key and
      # says so in a warning; that artefact can never be uploaded, which is what the Gradle guard protects.
      - name: Materialise upload keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.OSRA_UPLOAD_KEYSTORE_B64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.PARENT_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "OSRA_UPLOAD_KEYSTORE_B64 not set — release build will use the debug key (by design)"
            exit 0
          fi
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::warning::PARENT_GOOGLE_SERVICES_JSON_B64 is not set, so this release AAB is debug-signed and cannot be uploaded to Play. Set the secret to sign it with the upload key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
          echo "OSRA_UPLOAD_KEYSTORE=upload.jks" >> "$GITHUB_ENV"
          echo "upload keystore materialised"
      # #400: the moment OSRA_UPLOAD_KEYSTORE_B64 exists, the Gradle build refuses a signed release that
      # has no google-services.json (app/build.gradle.kts). This step has to materialise it first, or every
      # release build fails with "google-services.json is missing for a signed release build".
      - name: Materialise Firebase config (if configured)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.PARENT_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "PARENT_GOOGLE_SERVICES_JSON_B64 not set — this build has no Firebase config, so push is absent (never commit google-services.json, #317)"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
          echo "google-services.json materialised"
      - name: Release build (AAB)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          OSRA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.OSRA_UPLOAD_KEYSTORE_PASSWORD }}
          OSRA_UPLOAD_KEY_ALIAS: ${{ secrets.OSRA_UPLOAD_KEY_ALIAS }}
          OSRA_UPLOAD_KEY_PASSWORD: ${{ secrets.OSRA_UPLOAD_KEY_PASSWORD }}
          # The server the store build talks to out of the box (server_provider.dart kDefaultServerUrl).
          # A repository variable, not code. A signed (store) build must have it: the built-in server is what
          # locks the login screen's Server field (osra-security#8 F3), so a signed build without it fails here,
          # except on a pull request, whose bundle is never uploaded (a warning there). An unsigned build (forks)
          # may leave it unset and keeps the editable field. Never an
          # http:// URL: the release network config is HTTPS-only.
          OSRA_API_BASE: ${{ vars.OSRA_API_BASE }}
        run: |
          case "$OSRA_API_BASE" in
            "")
              # Pull-request runs in this repository get the signing key too, but their bundle is never
              # uploaded: a warning there, so one missing variable does not turn every parent-app PR red.
              if [ -n "$OSRA_UPLOAD_KEYSTORE_PASSWORD" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
                echo "::error::a signed (store) build needs OSRA_API_BASE: without it the server field is unlocked (osra-security#8 F3)"; exit 1
              fi
              if [ -n "$OSRA_UPLOAD_KEYSTORE_PASSWORD" ]; then
                echo "::warning::OSRA_API_BASE not set: this signed PR bundle has an unlocked server field; main's build fails until it is set (osra-security#8 F3)"
              else
                echo "OSRA_API_BASE not set: unsigned build, no built-in server address"
              fi ;;
            https://*) echo "built-in server: $OSRA_API_BASE" ;;
            *) echo "::error::OSRA_API_BASE must start with https://"; exit 1 ;;
          esac
          # Play refuses a versionCode it already has, so the bundle number rises with every run: the
          # workflow's own run number only ever increases, and each app is published by one workflow.
          flutter build appbundle --release --build-number="${{ github.run_number }}" --dart-define=API_BASE="$OSRA_API_BASE"
      - name: Release manifest must declare INTERNET
        run: |
          unzip -p build/app/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml > /tmp/manifest.bin
          # The AAB manifest is protobuf; the permission string survives as plain text.
          grep -q "android.permission.INTERNET" /tmp/manifest.bin && echo "INTERNET present"
      - uses: actions/upload-artifact@v4
        with:
          name: parent-app-release-aab
          path: apps/parent-app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # Whether this run builds iOS. A macOS minute bills as ten Linux minutes once the repository is private,
  # and most parent-app changes are Dart only, which the Android release build above already compiles. So a
  # pull request or a push builds iOS only when it changes something the iOS build reads and the Android one
  # does not: the `ios/` tree, `pubspec.yaml` or `pubspec.lock` (a plugin brings its own native code), or this
  # file. The nightly and manual runs always build it, which is how a Dart change or a new Flutter stable that
  # breaks only iOS reaches `main` within a day. When the diff cannot be read, it builds rather than skips.
  ios-scope:
    name: Does this change reach the iOS build?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE=HEAD^1 ;;   # the merge commit's first parent is the base it was merged onto
            push) BASE=$BEFORE ;;
            *)
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "$EVENT run: the iOS build always runs"
              exit 0 ;;
          esac
          if ! git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "cannot diff against $BASE: building iOS rather than skipping it"
            exit 0
          fi
          if grep -E '^apps/parent-app/ios/|^apps/parent-app/pubspec[.](yaml|lock)$|^[.]github/workflows/parent-app[.]yml$' \
              "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/ios-inputs.txt"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "iOS inputs changed ($(wc -l < "$RUNNER_TEMP/ios-inputs.txt")), the first 20:"
            head -20 "$RUNNER_TEMP/ios-inputs.txt"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "no iOS input among $(wc -l < "$RUNNER_TEMP/changed.txt") changed file(s); the nightly run still builds iOS"
          fi

  # Roadmap 3.9: the iOS target exists in the same tree. This job is the *only*
  # evidence the iOS build is real — no machine on the programme has Xcode, so
  # nothing here was ever built locally (a `flutter build ios` on Windows fails
  # with "Building for iOS is only supported on macOS", which proves nothing).
  # `--no-codesign`: no certificate, no provisioning profile and no Apple
  # account are involved, which is why this can run on a public repository for
  # free. It is a simulator-target build, NOT an App Store build — signing,
  # entitlements and archiving are separate work (docs/ROADMAP.md 3.9, 5.5, 5.6).
  # It runs when `ios-scope` says so (above).
  parent-app-ios:
    name: iOS build (no code signing)
    needs: ios-scope
    if: needs.ios-scope.outputs.build == 'true'
    # macOS 15 for Xcode 16. `firebase_messaging` brings FirebaseCoreInternal, whose Swift 6
    # concurrency (`sending`, access-level imports) does not compile with the Xcode 15 that
    # macos-14 defaults to: the run failed inside Pods/FirebaseCoreInternal, not in our code.
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/parent-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned (2026-11-11): stable 3.50.0 deprecates `package:flutter/material.dart` in favour of
          # `package:material_ui`, and `flutter analyze` fails on the resulting infos in every file. The
          # move to material_ui is its own change; until it lands, CI and release builds stay on the last
          # stable that built main green (run 43083839765). Raise this together with that migration.
          flutter-version: 3.47.9
          cache: true
      # Plugins link through CocoaPods, not Swift Package Manager (#392). A Flutter plugin picks its own
      # integration, and `firebase_messaging` ships a podspec and no `Package.swift`, so an SPM-only
      # target cannot compile it. The flag is global to the tool on the runner and must be set before
      # any build; `ios/Podfile` is committed and pins `platform :ios, '15.0'` to match the project.
      - name: Link plugins through CocoaPods
        run: |
          flutter config --no-enable-swift-package-manager
          # The two halves of the migration must agree: a project that still references the ephemeral
          # SPM package while the tool builds Pods fails to link, and that half-migration is what kept
          # this job red on three heads (#392). Fail here, with the reason, rather than inside Xcode.
          if grep -q 'FlutterGeneratedPluginSwiftPackage' ios/Runner.xcodeproj/project.pbxproj; then
            echo "Runner.xcodeproj still references the SPM package; the migration is half done" >&2
            exit 1
          fi
          test -f ios/Podfile || { echo "ios/Podfile is missing" >&2; exit 1; }
          echo "CocoaPods target confirmed: no SPM reference, Podfile present"
      - run: flutter pub get
      - name: Build the iOS target unsigned
        run: flutter build ios --release --no-codesign
      - name: The bundle identifiers are the Play ids (decision 2B)
        run: |
          # The App Store id equals the Android applicationId, com.osratech.parent (#452); the test
          # bundle hangs under it. Every build configuration is read, not just the first.
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*' ios/Runner.xcodeproj/project.pbxproj | sed 's/.*= //' | sort | uniq -c
          if grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*' ios/Runner.xcodeproj/project.pbxproj | sed 's/.*= //' \
            | grep -vxE 'com\.osratech\.parent(\.RunnerTests)?'; then
            echo "unexpected bundle id(s) above" >&2; exit 1
          fi
          echo "ok"
      - name: Info.plist declares the display name and both locales
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" | grep -qx 'OSRA'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations:0' "$PLIST" | grep -qx 'en'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations:1' "$PLIST" | grep -qx 'ar'
          echo "display name and en/ar localizations present"
      # #410: an iOS parent alert is built from loc-keys, so these two files are the only words the parent
      # sees. A pbxproj that compiles but never copies them shows the raw key on the lock screen, and no
      # other gate can tell: there is no Xcode anywhere else on the programme.
      - name: The push alert strings ship in the bundle, in both languages (#410)
        run: |
          APP=build/ios/iphoneos/Runner.app
          for L in en ar; do
            F="$APP/$L.lproj/Localizable.strings"
            test -f "$F" || { echo "missing $F" >&2; ls "$APP" >&2; exit 1; }
            plutil -lint "$F"
            for K in PUSH_ALERT_TITLE PUSH_ALERT_BODY; do
              V=$(plutil -extract "$K" raw -o - "$F") || { echo "$K missing in $L" >&2; exit 1; }
              test -n "$V" || { echo "$K is empty in $L" >&2; exit 1; }
            done
          done
          echo "en and ar Localizable.strings are in Runner.app with both keys"
