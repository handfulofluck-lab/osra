name: terraform

# `infra/terraform/README.md` tells a reader to run `fmt -check` and `validate` before a PR; until this
# file existed nothing ran them, so a stack could land that does not even parse. No `plan` and no
# `apply`: `plan` needs credentials and base's state, and creating infrastructure is a human step.
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/scripts/**"
      - ".github/workflows/terraform.yml"

jobs:
  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      # Pinned by full SHA (v3) so a moved tag cannot change what runs against this repo.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.4

      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive

      # production-secrets.sh's generators, under its own `set -euo pipefail` (#781 review B1). No AWS call.
      - name: secret generators
        run: bash tests/secret-gen.sh

      # -backend=false skips the S3 backend, so this needs no AWS credentials and no base state.
      # `terraform test` runs each stack's tests/*.tftest.hcl against a MOCKED AWS provider (#714): no
      # credentials, nothing created. They pin staging's settings and production's (Multi-AZ, backups, TLS,
      # WAF, alarms), so neither can drift without a red check.
      - name: base — init (no backend), validate and test
        run: |
          terraform -chdir=base init -backend=false -input=false
          terraform -chdir=base validate
          terraform -chdir=base test

      - name: env — init (no backend), validate and test
        run: |
          terraform -chdir=env init -backend=false -input=false
          terraform -chdir=env validate
          terraform -chdir=env test

      - name: bootstrap-state — init (no backend) and validate
        run: |
          terraform -chdir=bootstrap-state init -backend=false -input=false
          terraform -chdir=bootstrap-state validate

      - name: org-audit — init (no backend), validate and test
        run: |
          terraform -chdir=org-audit init -backend=false -input=false
          terraform -chdir=org-audit validate
          terraform -chdir=org-audit test

      - name: agent credential and source policy fakes
        env:
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_EC2_METADATA_DISABLED: "true"
        run: python3 -B -m unittest discover -s org-audit/tests -p 'test_agent_*.py'

      # Its own root (own-model training bucket and role). The test pins who can reach the bucket and
      # what the training role can do, so "it has no access to anything else" survives the next edit.
      - name: ml-training — init (no backend), validate and test
        run: |
          terraform -chdir=ml-training init -backend=false -input=false
          terraform -chdir=ml-training validate
          terraform -chdir=ml-training test

      - name: site — init (no backend) and validate
        run: |
          terraform -chdir=site init -backend=false -input=false
          terraform -chdir=site validate
