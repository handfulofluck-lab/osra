name: API image

# The API image used to be built with `|| true` around the install and the build, so a broken image was
# indistinguishable from a working one. This job builds it on every pull request — no push, no
# credentials — and then runs the two things staging runs: migrate + seed (twice, for idempotency) and a
# boot that answers /health/deep. A build that cannot migrate or seed is a build that fails at the first
# `up.sh`, which is exactly where we do not want to find out.
#
# Paths (2026-10-24): this used to run on every pull request with no `paths:` filter, on the reasoning that a
# gate which skips itself reports green by absence. That reasoning holds for `probe-integrity` (a policy over
# every PR, one cheap script) and is why that job keeps running everywhere. It does not hold here: the image
# is built only from the files listed below (the Dockerfile COPYs nothing else and the build context is the
# repository root), so a PR that changes none of them builds the same image main already built. It is not a
# required check either — `verified-gate` is the only one — so a run that did not happen can never be read
# as a pass. The nightly run on main catches the drift no PR would trigger (base image, runner, pnpm).
# `scripts/check-ci-paths.mjs` checks that the list names this file and every file the Dockerfile COPYs.
# Since #668 it also covers the scenario helper's live case, which only this Ubuntu job can run: see the last step.
on:
  pull_request:
    paths:
      - "services/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - "scripts/hardware/scenario-family.mjs"
      - "scripts/hardware/scenario-family.test.mjs"
      - ".github/workflows/api-image.yml"
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

concurrency:
  group: api-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-image:
    name: Build the API image and check it inside
    # GitHub's free arm64 runner for public repositories: Fargate runs ARM64 (ADR-0028), so CI tests the
    # architecture that is actually deployed, with no QEMU emulation. ECR stores images, it does not
    # build them, so this is the only place the image is produced today.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      # The scenario step below runs `node --test` and greps its summary line; that line is the 20.x
      # reporter's (`ℹ pass N`), where 18 prints `# pass N`. Pin the version rather than take whatever the
      # runner image happens to carry.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: osra-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same assertions the next person runs locally; SKIP_BUILD reuses the image above.
      - name: Verify node, the Prisma CLI, tsx and the entry file inside the image
        env:
          IMAGE: osra-api:ci
          SKIP_BUILD: "1"
        run: sh services/api/scripts/verify-image.sh

      # What staging does, in the image staging runs. Two seeds prove the seed is idempotent; the boot
      # proves migrations and seeds landed, with /health/deep requiring both Postgres and Redis.
      # No password is committed: Postgres trusts the runner's loopback and every other value is
      # generated per run.
      - name: Migrate, seed twice and boot, the way staging does
        run: |
          set -eu
          DB=postgresql://postgres@127.0.0.1:5432/postgres
          SEED=$(openssl rand -hex 16)
          for i in 1 2; do
            echo "==> migrate + seed, run $i"
            docker run --rm --network host \
              -e NODE_ENV=production -e DATABASE_URL="$DB" -e SEED_DEMO_PASSWORD="$SEED" \
              osra-api:ci sh scripts/migrate-and-seed.sh
          done
          echo "==> boot"
          docker run -d --name api --network host \
            -e NODE_ENV=production -e PORT=3000 \
            -e DATABASE_URL="$DB" -e REDIS_URL=redis://127.0.0.1:6379 \
            -e JWT_SECRET="$(openssl rand -hex 32)" -e VAULT_KEY="$(openssl rand -base64 32)" \
            osra-api:ci
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/health/deep \
            || { echo "boot failed; container logs:"; docker logs api; exit 1; }

      # The scenario helper (#668) signs a family up through the public API, erases it, and reads every
      # child-scoped table back: non-zero residue exits 1. Its live case is skipped unless SCENARIO_API_BASE
      # is set, and this is the Ubuntu job whose stack is a real API on real Postgres and Redis — the
      # container booted above answers on 127.0.0.1:3000 (`--network host`), so the boot step no longer
      # removes it; this step does, and the runner is ephemeral if a grep below fails first.
      # One run, not two: each invocation signs an account up and erases it. `pass 25` cannot appear if the
      # live case skipped (that run says 21 pass, 1 skipped) or failed; `pipefail` carries a failing run's
      # exit through the pipe; `fail 0` is asserted because a 26th case that failed would leave `pass 25`.
      - name: A scenario family is created and erased through the API, and leaves no residue (#668)
        env:
          SCENARIO_API_BASE: http://127.0.0.1:3000
        run: |
          set -o pipefail
          out=$(node --test scripts/hardware/scenario-family.test.mjs 2>&1 | tee /dev/stderr)
          printf '%s\n' "$out" | grep -q 'pass 25$'
          printf '%s\n' "$out" | grep -q 'fail 0$'
          docker rm -f api
