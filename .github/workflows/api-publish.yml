name: Publish API image

# Publishing needs a credential. A long-lived AWS key is what ADR-0028 §8 rules out, so the job trades
# a GitHub OIDC token for the `osra-staging-publish` role (infra/terraform/base/oidc.tf) and the only
# credential that exists lasts for the run.
# `workflow_dispatch` only: the role trusts `main` and the `staging-publish` environment, not a pull
# request, so a publish is a deliberate act and nothing here can run on a PR.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build (branch, tag or SHA).
        required: false
        default: main
      tag:
        description: Image tag to push. Empty means the 12-character commit sha.
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

# Two publishes would race on `:latest`; queue them instead of cancelling a push mid-upload.
concurrency:
  group: api-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build linux/arm64 and push to ECR
    # Refuse to push from a fork: its copy of this file must not assume a role in this account.
    if: github.repository == 'handfulofluck-lab/osra'
    # GitHub's arm64 runner: no QEMU emulation, and Fargate runs ARM64 (ADR-0028).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Both values come from repository variables because Actions cannot read base's Terraform state.
      - name: Require the repository variables
        env:
          AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          AWS_PUBLISH_ROLE_ARN: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
        run: |
          set -eu
          if [ -z "$AWS_ECR_REPOSITORY" ]; then
            echo "::error::AWS_ECR_REPOSITORY is unset. After base is applied: gh variable set AWS_ECR_REPOSITORY --body \"\$(terraform -chdir=infra/terraform/base output -raw ecr_repository_url)\""
            exit 1
          fi
          if [ -z "$AWS_PUBLISH_ROLE_ARN" ]; then
            echo "::error::AWS_PUBLISH_ROLE_ARN is unset. After base is applied: gh variable set AWS_PUBLISH_ROLE_ARN --body \"\$(terraform -chdir=infra/terraform/base output -raw publish_role_arn)\""
            exit 1
          fi

      # Pinned by full SHA (v4) so a moved tag cannot change what receives the OIDC token.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: me-central-1
          role-session-name: ${{ github.run_id }}

      - name: Log in to ECR
        env:
          AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
        run: |
          # The registry host is everything before the first `/` of the repository URL.
          aws ecr get-login-password --region me-central-1 \
            | docker login --username AWS --password-stdin "${AWS_ECR_REPOSITORY%%/*}"

      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(git rev-parse --short=12 HEAD)"
          fi
          echo "Publishing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.AWS_ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ vars.AWS_ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
