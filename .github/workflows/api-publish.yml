name: Publish API image

# Publishing needs a credential. A long-lived AWS key is what ADR-0028 §8 rules out, so the job trades
# a GitHub OIDC token for the `osra-staging-publish` role (infra/terraform/base/oidc.tf) and the only
# credential that exists lasts for the run.
# `workflow_dispatch` only, and only from `main`: the role's trust names that one branch, so a publish
# is a deliberate act and nothing here can run on a PR or from a feature branch.
# It builds `github.sha` and nothing else. A `ref` input would be a way around the gate: the OIDC
# subject comes from the branch the run was started on, not from what checkout fetches, so a run on
# `main` could build unverified code from another branch and push it under a `main`-only role.
# `target` picks the account (#766 item 8). Each account has its own publish role, trusted for this
# repository's `main` only, and its own immutable repository; the role and repository come from separate
# repository variables so a staging value can never point a production run at the wrong account.
# Publishing to production only puts an image in its registry: nothing runs it until a reviewed
# Terraform plan names that tag in `env/api_image`.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which account's registry to push to"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write

# Queue rather than cancel: a cancelled run can leave a half-uploaded layer.
concurrency:
  group: api-publish-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build linux/arm64 and push to ECR
    # Refuse to push from a fork: its copy of this file must not assume a role in this account.
    if: github.repository == 'handfulofluck-lab/osra' && github.ref == 'refs/heads/main'
    # GitHub's arm64 runner: no QEMU emulation, and Fargate runs ARM64 (ADR-0028).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      # Both values come from repository variables because Actions cannot read base's Terraform state.
      - name: Require the repository variables
        id: target
        env:
          STAGING_REPO: ${{ vars.AWS_ECR_REPOSITORY }}
          STAGING_ROLE: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          PRODUCTION_REPO: ${{ vars.AWS_PRODUCTION_ECR_REPOSITORY }}
          PRODUCTION_ROLE: ${{ vars.AWS_PRODUCTION_PUBLISH_ROLE_ARN }}
        run: |
          set -eu
          # Chosen in the shell, not with `a && b || c` in an expression: that form falls back to the
          # staging value when the production variable is empty.
          case "$TARGET" in
            staging) PREFIX=""; AWS_ECR_REPOSITORY="$STAGING_REPO"; AWS_PUBLISH_ROLE_ARN="$STAGING_ROLE" ;;
            production) PREFIX="PRODUCTION_"; AWS_ECR_REPOSITORY="$PRODUCTION_REPO"; AWS_PUBLISH_ROLE_ARN="$PRODUCTION_ROLE" ;;
            *) echo "::error::unknown target '$TARGET'"; exit 1 ;;
          esac
          if [ -z "$AWS_ECR_REPOSITORY" ]; then
            echo "::error::AWS_${PREFIX}ECR_REPOSITORY is unset. After $TARGET base is applied: gh variable set AWS_${PREFIX}ECR_REPOSITORY --body \"\$(terraform -chdir=infra/terraform/base output -raw ecr_repository_url)\""
            exit 1
          fi
          if [ -z "$AWS_PUBLISH_ROLE_ARN" ]; then
            echo "::error::AWS_${PREFIX}PUBLISH_ROLE_ARN is unset. After $TARGET base is applied: gh variable set AWS_${PREFIX}PUBLISH_ROLE_ARN --body \"\$(terraform -chdir=infra/terraform/base output -raw publish_role_arn)\""
            exit 1
          fi
          # The role and the repository must be in the same account, and production's repository must be
          # production's: a crossed variable fails here instead of pushing into the wrong registry.
          ROLE_ACCOUNT="$(printf '%s' "$AWS_PUBLISH_ROLE_ARN" | cut -d: -f5)"
          REPO_ACCOUNT="${AWS_ECR_REPOSITORY%%.*}"
          if [ "$ROLE_ACCOUNT" != "$REPO_ACCOUNT" ]; then
            echo "::error::publish role and repository are in different accounts"; exit 1
          fi
          case "$AWS_ECR_REPOSITORY" in
            */osra-${TARGET}/api) ;;
            *) echo "::error::repository must be osra-${TARGET}/api for target ${TARGET}"; exit 1 ;;
          esac
          HOST="${AWS_ECR_REPOSITORY%%/*}"
          echo "region=$(printf '%s' "$HOST" | cut -d. -f4)" >> "$GITHUB_OUTPUT"
          echo "AWS_ECR_REPOSITORY=$AWS_ECR_REPOSITORY" >> "$GITHUB_ENV"
          echo "AWS_PUBLISH_ROLE_ARN=$AWS_PUBLISH_ROLE_ARN" >> "$GITHUB_ENV"

      # Pinned by full SHA (v4) so a moved tag cannot change what receives the OIDC token.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ env.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ steps.target.outputs.region || 'eu-north-1' }}
          role-session-name: ${{ github.run_id }}

      - name: Log in to ECR
        run: |
          # `pipefail` matters here: without it a failed `get-login-password` is masked by the pipeline's
          # last command, so the step would report the confusing `docker login` error instead of the real one.
          set -euo pipefail
          # The registry host is everything before the first `/` of the repository URL, and the region sits
          # inside that host: ACCOUNT.dkr.ecr.REGION.amazonaws.com. Deriving it keeps the login tied to the
          # registry the push goes to; a hardcoded region returned `400 Bad Request` from docker login the
          # one time the variable pointed at another region, which reads like an auth failure.
          HOST="${AWS_ECR_REPOSITORY%%/*}"
          # A malformed variable must fail here, naming the value: `osra-staging/api` would otherwise yield
          # the "region" `osra-staging`, and a `public.ecr.aws/...` host an empty one, and both surface later
          # as an AWS error that says nothing about the variable.
          case "$HOST" in
            *.dkr.ecr.*.amazonaws.com) ;;
            *) echo "::error::AWS_ECR_REPOSITORY must be ACCOUNT.dkr.ecr.REGION.amazonaws.com/REPO; host was '$HOST'"; exit 1 ;;
          esac
          REGION="$(printf '%s' "$HOST" | cut -d. -f4)"
          echo "registry $HOST (region $REGION)"
          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$HOST"

      # The tag is derived, never chosen: the repository is IMMUTABLE, so a tag always names one image.
      # A re-run on the same commit fails at the push with "tag already exists", which is correct — the
      # image for that commit is already there.
      - name: Resolve the tag
        id: tag
        run: |
          TAG="$(git rev-parse --short=12 HEAD)"
          echo "Publishing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/arm64
          push: true
          # No `:latest`: a mutable pointer in a task definition is how a "known good" deploy silently
          # becomes a different image. `env/api_image` pins the sha tag this produces.
          tags: ${{ env.AWS_ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
