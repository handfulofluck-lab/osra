name: API

# Backend API + shared packages (unit suites run fully mocked). Until 2026-10-24 this was the `api` job of
# ci.yml and ran on every pull request; now it runs when its inputs change, on main when they change, and
# nightly on main whatever changed (a new pnpm or runner image breaks main even when no PR touched the API).
# The `paths:` lists below must stay identical, must name this file, and must cover every file outside
# `services/api/` that an API test reads: `scripts/check-ci-paths.mjs` checks all three in workflow-lint.
# WorkScheduler.kt and LocationService.kt are read by `services/api/test/device-silence.test.ts` (#166),
# which pins the server's silence window to the agent's reporting cadence; IdleCadence.kt is read by
# `services/api/test/poll-cadence.test.ts` (#353), which pins X-Poll-After to the agent's clamps.
on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "apps/child-android/app/src/main/java/com/familyshield/agent/data/WorkScheduler.kt"
      - "apps/child-android/app/src/main/java/com/familyshield/agent/services/LocationService.kt"
      - "apps/child-android/app/src/main/java/com/familyshield/agent/services/IdleCadence.kt"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "apps/child-android/app/src/main/java/com/familyshield/agent/data/WorkScheduler.kt"
      - "apps/child-android/app/src/main/java/com/familyshield/agent/services/LocationService.kt"
      - "apps/child-android/app/src/main/java/com/familyshield/agent/services/IdleCadence.kt"
      - ".github/workflows/api.yml"
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

# Cancel superseded runs on the same ref; a nightly run never cancels a push run or the other way round.
concurrency:
  group: api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager" — do NOT also pass `with: version:` (the action fails with "Multiple versions of pnpm specified"; this broke the API + AI jobs on main)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm -r --filter "./packages/*" run build
      - name: Generate Prisma client (required for type-check; pnpm install does not create it)
        run: pnpm --filter @familyshield/api exec prisma generate
      - name: Type-check API
        run: pnpm --filter @familyshield/api run build
      - name: API unit tests (vitest, mocked db/redis)
        run: pnpm --filter @familyshield/api run test
