name: Agent desktop

# The Windows desktop agent. Until 2026-10-24 this was the `agent-desktop` job of ci.yml and ran on every pull
# request on a Windows runner (billed at twice the Linux rate in a private repository); now it runs when the
# agent changes, on main when it changes, and nightly on main whatever changed. Nothing outside
# `apps/agent-desktop/` is read by this job. `scripts/check-ci-paths.mjs` keeps the two lists identical and
# makes sure they name this file.
on:
  push:
    branches: [main]
    paths:
      - "apps/agent-desktop/**"
      - ".github/workflows/agent-desktop.yml"
  pull_request:
    paths:
      - "apps/agent-desktop/**"
      - ".github/workflows/agent-desktop.yml"
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

concurrency:
  group: agent-desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/agent-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/FamilyShield.Agent.Tests --nologo
