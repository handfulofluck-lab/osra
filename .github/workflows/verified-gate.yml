name: verified-gate

# AGENTS.md §6.5 / §10: a PR merges only after someone other than the author has verified it.
#
# Decided by the maintainer on 2026-10-19 ("Enforce with CI") after seven PRs merged in one night on
# the author's own run, before or without the reviewer's points being addressed (#164, #168, #169,
# #171, #174, #180, #187). Until then §6.5 was a written rule only; this is its server-side half.
#
# The check passes only when BOTH hold:
#   1. the PR carries the `state:verified` label, and
#   2. a PR comment WRITTEN BY THE AGENT ACCOUNT (SIGNER_LOGIN below) and signed by a verifier
#      ("— Antigravity", "— Claude", or "— Kimi Code" for a PR Kimi did not author) contains a line
#      `Verified-sha: <sha>` whose sha is a prefix (7+ characters) of the PR's CURRENT head.
# (2) is what makes rule 4 of §6.5 ("the verified sha is the merged sha") mechanical: any push after
# verification — a fix, a rebase, a merge of main — changes the head, and the gate goes red again
# until the new head is verified. No label removal is needed for that, so this job needs no write
# permission.
#
# WHO MAY SIGN (2026-10-23): only comments whose author is SIGNER_LOGIN are read. The repository is public,
# so anyone with a GitHub account can comment on a PR, and a second member with write access (Ahmed,
# `ahmedyusseff`, security + testing) joined on 2026-10-23 working with his own Claude Code agent. Before
# this, a comment from ANY account ending "— Claude" with the head sha satisfied (2), so a signature typed
# by any commenter, or by another member's agent that is also called Claude, counted as Claude's.
# Self-test: scripts/check-verified-gate-signers.mjs (run by workflow-lint).
# Carry-forward decision: scripts/verified-gate-carry.mjs, with its own `--selftest` (also run by
# workflow-lint) over real-git fixtures.
#
# HONEST LIMIT: all agents still share that one GitHub account, so CI cannot prove WHICH agent wrote a
# comment or set the label, and a member with write access can edit an agent's comment (GitHub keeps the
# edit history on the comment). A forged verification is still a signed, permanent record on the PR. The
# gate turns "merged without verification" from an oversight into a deliberate act.
#
# CARRY-FORWARD (added 2026-10-19, issue #207): main's protection is `strict` (branch up to date), so every
# merge forces the PRs behind it to merge main in, which changes their head. A signature at sha S still
# counts for head H when (a) S is an ancestor of H and every commit in S..H that is not on main is a
# merge commit, and
# (b) the PR's own change is identical: diff(merge-base(main,S), S) and diff(merge-base(main,H), H)
# have the same `git patch-id --stable`, compared with -U0 on BOTH sides. `patch-id` hashes hunks with
# their context lines, and folding main in moves the merge base, so an edit by main near the PR's hunks
# changed the context while the change itself did not — and the gate refused a correctly folded merge
# (#357: on #349 the default-context ids differed while the -U0 ids were equal and both diffstats were
# identical). -U0 still catches a different change — a deleted or added line, a changed value, another
# file — but not a pure line move, which is the accepted cost of not switching to `git range-diff`.
# A merge that resolves a conflict inside the PR's files, or adds anything that is not main's, changes
# (b) and needs a fresh verification.
#
# ORDER for verifiers: post the signed comment first, then add the label. Adding (or removing and
# re-adding) the label is what re-runs this check; a comment alone does not.
#
# To bind, this check must be "required" in main's branch protection, with "Do not allow bypassing"
# (enforce_admins) on — every agent pushes as a repo admin. See AGENTS.md §6.4.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  verified-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The carry-forward decision runs as scripts/verified-gate-carry.mjs, so pin the interpreter the
      # self-test (workflow-lint) and this job both use rather than relying on the runner image's node.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require state:verified and a signed verification of the head sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The only account whose comments can verify (see WHO MAY SIGN above). Every agent and the
          # maintainer post as it; a comment by any other account is never read as a verification.
          SIGNER_LOGIN: handfulofluck-lab
        run: |
          set -euo pipefail
          echo "PR #$PR head $HEAD_SHA"

          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          if ! printf '%s\n' "$labels" | grep -qx 'state:verified'; then
            echo "::error::Not verified: PR #$PR has no 'state:verified' label (AGENTS.md §6.5, §10)."
            echo "Antigravity, Claude or (for a PR Kimi did not author) Kimi Code verifies, posts a signed comment with 'Verified-sha: <head sha>', then adds the label."
            exit 1
          fi

          # "Kimi did not author" is checkable: Kimi commits as kimi@familyshield.local. Count Kimi-authored
          # NON-merge commits on the PR (a merge of main into the branch is bookkeeping, not authorship).
          # If there are any, a "— Kimi Code" signature does not count as verification. Added 2026-10-19
          # after #196 was verified by Kimi at a head that contained a Kimi-authored change to this file.
          kimi_commits=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '[.[] | select((.parents | length) == 1) | select(.commit.author.email == "kimi@familyshield.local")] | length' | awk '{s += $1} END {print s + 0}')
          echo "Kimi-authored non-merge commits on this PR: $kimi_commits"

          # Say how many comments were left out, so a run log shows the filter working rather than hiding.
          others=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '[.[] | select(.user.login != env.SIGNER_LOGIN)] | length' | awk '{s += $1} END {print s + 0}')
          echo "Comments by accounts other than $SIGNER_LOGIN (never read as a verification): $others"

          # One line per comment body (newlines flattened), from SIGNER_LOGIN only. Signed by a verifier
          # AND naming a sha.
          verified=""
          signed=""
          while IFS= read -r body; do
            [ -n "$body" ] || continue
            # The signer is the LAST "— <name>" in the body: a comment that merely mentions another
            # agent's signature (as #196's verification did) must not count as signed by that agent.
            signer=$(printf '%s' "$body" | awk '{ while (match($0, /— (Antigravity|Claude|Kimi Code)/)) { last = substr($0, RSTART, RLENGTH); $0 = substr($0, RSTART + RLENGTH) } } END { print last }')
            case "$signer" in
              "— Antigravity"|"— Claude") ;;
              "— Kimi Code")
                if [ "$kimi_commits" -gt 0 ]; then
                  echo "ignoring a Kimi Code verification: Kimi authored $kimi_commits commit(s) on this PR"
                  continue
                fi
                ;;
              *) continue ;;
            esac
            for sha in $(printf '%s' "$body" | grep -oiE 'Verified-sha:[[:space:]]*`?[0-9a-f]{7,40}' | grep -oiE '[0-9a-f]{7,40}$'); do
              sha=$(printf '%s' "$sha" | tr 'A-F' 'a-f')
              signed="$signed $sha"
              case "$HEAD_SHA" in
                "$sha"*) verified="$sha" ;;
              esac
            done
          done < <(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.user.login == env.SIGNER_LOGIN) | .body | gsub("[[:cntrl:]]"; " ")')

          # Carry-forward (see header): only merges after the signature, and the PR's own patch unchanged.
          # The decision is scripts/verified-gate-carry.mjs (self-tested by workflow-lint): it compares the
          # two patches with -U0 on both sides, prints carried/differs/cannot-decide, and exits 0/1/2. Any
          # nonzero exit means this signature is not carried, so the loop moves on to the next one.
          if [ -z "$verified" ] && [ -n "$signed" ]; then
            for sha in $signed; do
              if node scripts/verified-gate-carry.mjs "$sha" "$HEAD_SHA"; then
                verified="$sha (carried forward)"
                break
              fi
            done
          fi

          if [ -z "$verified" ]; then
            echo "::error::'state:verified' is set, but no comment by $SIGNER_LOGIN signed by Antigravity, Claude or Kimi Code verifies the current head $HEAD_SHA."
            echo "A push after verification (fix, rebase, merge of main) needs a fresh verification of the new head (AGENTS.md §6.5 rule 4), unless it only merged main and left the PR's own change identical."
            exit 1
          fi
          echo "OK — head $HEAD_SHA verified (Verified-sha: $verified)."
