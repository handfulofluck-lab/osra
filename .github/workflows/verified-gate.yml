name: verified-gate

# AGENTS.md §6.5 / §10: a PR merges only after someone other than the author has verified it.
#
# Decided by the maintainer on 2026-10-19 ("Enforce with CI") after seven PRs merged in one night on
# the author's own run, before or without the reviewer's points being addressed (#164, #168, #169,
# #171, #174, #180, #187). Until then §6.5 was a written rule only; this is its server-side half.
#
# The check passes only when BOTH hold:
#   1. the PR carries the `state:verified` label, and
#   2. PR comments WRITTEN BY THE AGENT ACCOUNT (SIGNER_LOGIN below) carry `Verified-sha: <sha>` lines whose sha
#      is a prefix (7+ characters) of the PR's CURRENT head (or carries forward), signed by enough members for
#      this PR under the MESH POLICY (maintainer 2026-11-13 15:42Z, AGENTS.md §6.6, scripts/verified-gate-policy.mjs):
#      never the author; a different model family from the author for R2; for R3 two signers, one cross-family
#      and one security key (Ahmed or Fable); plus the UI/UX and Arabic Bureau lines when the diff needs them.
#      Signer names: Claude, Fable, Kimi Code, K31, K31-Mac, Ahmed (and Antigravity, inactive).
# (2) is what makes rule 4 of §6.5 ("the verified sha is the merged sha") mechanical: any push after
# verification — a fix, a rebase, a merge of main — changes the head, and the gate goes red again
# until the new head is verified. No label removal is needed for that, so this job needs no write
# permission.
#
# WHO MAY SIGN (2026-10-23): only comments whose author is SIGNER_LOGIN are read. The repository is public,
# so anyone with a GitHub account can comment on a PR, and a second member with write access (Ahmed,
# `ahmedyusseff`, security + testing) joined on 2026-10-23 working with his own Claude Code agent. Before
# this, a comment from ANY account ending "— Claude" with the head sha satisfied (2), so a signature typed
# by any commenter, or by another member's agent that is also called Claude, counted as Claude's.
# SECURITY KEY ACCOUNT (maintainer 2026-11-13 21:15Z, #617): Ahmed's own agent signs as the R3 security key
# from his own account (SECURITY_KEY_LOGIN below). From that account the gate keeps only `Verified-sha:`
# signatures whose signer is "— Ahmed"; any other signer name or Bureau line from it is dropped. And because
# every agent posts from SIGNER_LOGIN, a "— Ahmed" signature from SIGNER_LOGIN is dropped too: only Ahmed's
# own account can sign as Ahmed. And a comment from SECURITY_KEY_LOGIN counts only if it was never edited
# (created_at == updated_at): an admin account can edit another user's comment and the author field stays
# the same, so an edited comment could be anyone's words (Fable's review of #745). Ahmed posts a fresh one.
# Self-test: scripts/check-verified-gate-signers.mjs (run by workflow-lint).
# Carry-forward decision: scripts/verified-gate-carry.mjs — run from `origin/main`, so a PR's edit to the
# script does not judge its own carry-forward. Its `--selftest` (also run by workflow-lint) uses real-git
# fixtures. The workflow file itself still comes from the PR; see HONEST LIMIT.
#
# HONEST LIMIT: all agents still share that one GitHub account, so CI cannot prove WHICH agent wrote a
# comment or set the label, and a member with write access can edit an agent's comment (GitHub keeps the
# edit history on the comment). A forged verification is still a signed, permanent record on the PR. The
# gate turns "merged without verification" from an oversight into a deliberate act.
# The workflow and its script run from the PR's own code, so for a member with write access the gate is a
# convention, like the comment and the label. It does not stop someone who chooses to bypass it (#359).
#
# CARRY-FORWARD (added 2026-10-19, issue #207): main's protection is `strict` (branch up to date), so every
# merge forces the PRs behind it to merge main in, which changes their head. A signature at sha S still
# counts for head H when
# (a) S is an ancestor of H and every commit in S..H that is not on main is a merge commit,
# (b) every such merge is a clean merge of its parents: re-running `git merge-tree --write-tree <p1> <p2>`
# produces exactly the merge commit's own tree. A conflict, a hand resolution, an evil merge that adds
# something in neither parent, or a merge with other than two parents needs a fresh verification, and
# (c) the PR's own change is identical: diff(merge-base(main,S), S) and diff(merge-base(main,H), H)
# have the same `git patch-id --stable`, compared with -U0 on BOTH sides.
#
# Why -U0, and why (b) exists (2026-10-24, #357 and its review): `patch-id` hashes hunks with their context
# lines, and folding main in moves the merge base, so with the default context an edit by main near the PR's
# hunks refused a correctly folded merge (#349: default-context ids differed, -U0 ids equal, identical
# diffstats). Context had to go. But `patch-id` also drops the hunk header, including the function name, so
# -U0 no longer compares WHERE a line sits: a hand-edited fold could move the PR's line into another
# function and the patch would still hash the same. (b) closes that gap by allowing only merges git produced
# itself. The remaining limit is therefore a line moved by a clean merge, and that is git's own result.
#
# ORDER for verifiers: post the signed comment first, then add the label. Adding (or removing and
# re-adding) the label is what re-runs this check; a comment alone does not.
#
# To bind, this check must be "required" in main's branch protection, with "Do not allow bypassing"
# (enforce_admins) on — every agent pushes as a repo admin. See AGENTS.md §6.4.
#
# `edited` (2026-10-31, #501/#503): a STACKED PR whose base branch is deleted is retargeted to `main` by
# GitHub itself, and that emits `edited` (changes.base) — not `opened`, not `synchronize`. Without `edited`
# in this list the gate is never created for such a PR, and because this is the ONLY required status check
# on `main` the PR can never merge while every visible check is green and nothing says why. Measured on the
# scratch PR #503: retargeted from a non-main base to `main`, `workflow-lint` re-ran (its list has
# `edited`) and `verified-gate` stayed silent; #501's head `8464c1f` carries eight check runs and none of
# them is this one. `scripts/check-workflows.mjs` now fails if any of these seven events is dropped.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  verified-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The carry-forward decision runs as scripts/verified-gate-carry.mjs, so pin the interpreter the
      # self-test (workflow-lint) and this job both use rather than relying on the runner image's node.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require state:verified and a signed verification of the head sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The author is read from the branch prefix (AGENTS.md §6.6); a value, never interpolated into the script.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # The only account whose comments can verify (see WHO MAY SIGN above). Every agent and the
          # maintainer post as it; a comment by any other account is never read as a verification.
          SIGNER_LOGIN: handfulofluck-lab
          # Ahmed's own account: read for one thing only, a `Verified-sha:` line signed "— Ahmed" (header).
          SECURITY_KEY_LOGIN: ahmedyusseff
          SECURITY_KEY_NAME: Ahmed
        run: |
          set -euo pipefail
          echo "PR #$PR head $HEAD_SHA"

          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          if ! printf '%s\n' "$labels" | grep -qx 'state:verified'; then
            echo "::error::Not verified: PR #$PR has no 'state:verified' label (AGENTS.md §6.5, §10)."
            echo "A member who is not the author, from another model family (AGENTS.md §6.6), posts a signed comment with 'Verified-sha: <head sha>', then adds the label."
            exit 1
          fi

          # "Kimi did not author" is checkable: Kimi commits as kimi@familyshield.local. Count Kimi-authored
          # NON-merge commits on the PR (a merge of main into the branch is bookkeeping, not authorship).
          # If there are any, a "— Kimi Code" signature does not count as verification. Added 2026-10-19
          # after #196 was verified by Kimi at a head that contained a Kimi-authored change to this file.
          kimi_commits=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '[.[] | select((.parents | length) == 1) | select(.commit.author.email == "kimi@familyshield.local")] | length' | awk '{s += $1} END {print s + 0}')
          echo "Kimi-authored non-merge commits on this PR: $kimi_commits"

          # Say how many comments were left out, so a run log shows the filter working rather than hiding.
          others=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '[.[] | select(.user.login != env.SIGNER_LOGIN and .user.login != env.SECURITY_KEY_LOGIN)] | length' | awk '{s += $1} END {print s + 0}')
          echo "Comments by accounts other than $SIGNER_LOGIN and $SECURITY_KEY_LOGIN (never read as a verification): $others"

          # The policy (scripts/verified-gate-policy.mjs) parses the signatures and decides whether they are enough:
          # author from the branch prefix, model families, risk tier from labels and paths, Bureau lines. Taken from
          # origin/main like the carry script, so a PR cannot loosen the policy that judges it. The one exception is
          # bootstrap: before the policy reaches main, the PR's own copy is used and the log says so (to be removed
          # in the first PR after #721 merges).
          policy="$RUNNER_TEMP/verified-gate-policy.mjs"
          if ! git show origin/main:scripts/verified-gate-policy.mjs > "$policy" 2>/dev/null; then
            echo "::warning::origin/main has no scripts/verified-gate-policy.mjs yet (bootstrap): using this PR's copy."
            cp scripts/verified-gate-policy.mjs "$policy"
          fi

          # One JSON-encoded body per line, from SIGNER_LOGIN only. The policy's --parse turns each body into
          # signatures (kind, name, sha): a `Verified-sha:` / `UIUX-Bureau: reviewed` / `Arabic-Bureau: reviewed`
          # line counts only at the START of a line, outside code blocks and quotes, and the signer is the LAST line
          # that starts with "— <Name>" (a Bureau line needs the Bureau named there). A request that quotes a line
          # inline, in a code block or as a quote is therefore not a signature (Fable's review of #721).
          sigs="$RUNNER_TEMP/sigs.tsv"
          gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.user.login == env.SIGNER_LOGIN) | .body | @json' > "$RUNNER_TEMP/bodies.jsonl"
          # Only Ahmed's own account signs as Ahmed: drop a "— Ahmed" signature written from the shared account.
          node "$policy" --parse < "$RUNNER_TEMP/bodies.jsonl" | awk -F'\t' -v key="$SECURITY_KEY_NAME" '$2 != key' > "$sigs"
          # From Ahmed's account, keep only `Verified-sha:` signed "— Ahmed" (maintainer 2026-11-13 21:15Z, #617).
          # Never-edited comments only: an edit by any account (the shared one can edit his) voids the signature.
          gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.user.login == env.SECURITY_KEY_LOGIN and .created_at == .updated_at) | .body | @json' > "$RUNNER_TEMP/key-bodies.jsonl"
          edited=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '[.[] | select(.user.login == env.SECURITY_KEY_LOGIN and .created_at != .updated_at)] | length' | awk '{s += $1} END {print s + 0}')
          echo "Comments by $SECURITY_KEY_LOGIN skipped because they were edited (post a fresh comment to sign): $edited"
          node "$policy" --parse < "$RUNNER_TEMP/key-bodies.jsonl" | awk -F'\t' -v key="$SECURITY_KEY_NAME" '$1 == "verify" && $2 == key' >> "$sigs"
          echo "Signatures parsed (kind, name, sha), $SECURITY_KEY_LOGIN rows limited to verify by $SECURITY_KEY_NAME:"
          sed 's/^/  /' "$sigs"

          # Which signatures are valid for the CURRENT head: the sha is a prefix of the head, or it carries forward
          # (see header). The carry decision is scripts/verified-gate-carry.mjs, taken from origin/main rather than
          # from this checkout, so a PR's edit to the script does not judge its own carry-forward (#359); a missing
          # copy carries nothing (fails closed). Bureau lines carry forward by the same rule as Verified-sha.
          carry="$RUNNER_TEMP/verified-gate-carry.mjs"
          git show origin/main:scripts/verified-gate-carry.mjs > "$carry" 2>/dev/null || : > "$carry"
          valid="$RUNNER_TEMP/valid.tsv"
          : > "$valid"
          declare -A carried=()
          while IFS=$'\t' read -r kind name sha; do
            [ -n "$sha" ] || continue
            case "$HEAD_SHA" in
              "$sha"*) printf '%s\t%s\n' "$kind" "$name" >> "$valid"; continue ;;
            esac
            if [ -z "${carried[$sha]+x}" ]; then
              if [ -s "$carry" ] && node "$carry" "$sha" "$HEAD_SHA" >/dev/null 2>&1; then carried[$sha]=1; else carried[$sha]=0; fi
            fi
            if [ "${carried[$sha]}" = 1 ]; then
              echo "signature $kind $name at $sha carried forward to $HEAD_SHA"
              printf '%s\t%s\n' "$kind" "$name" >> "$valid"
            fi
          done < "$sigs"
          echo "Signatures valid at the head:"
          sort -u "$valid" | sed 's/^/  /'

          # Changed files, with the OLD name of a renamed file too, so moving a file out of an R3 path keeps R3.
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          printf '%s\n' "$labels" > "$RUNNER_TEMP/labels.txt"
          jq -n \
            --arg headRef "$HEAD_REF" \
            --argjson kimiCommits "$kimi_commits" \
            --rawfile labels "$RUNNER_TEMP/labels.txt" \
            --rawfile files "$RUNNER_TEMP/files.txt" \
            --rawfile valid "$valid" \
            '{headRef: $headRef, kimiCommits: $kimiCommits,
              labels: ($labels | split("\n") | map(select(length > 0))),
              files: ($files | split("\n") | map(select(length > 0))),
              signatures: ($valid | split("\n") | map(select(length > 0) | split("\t") | {kind: .[0], name: .[1]}))}' \
            > "$RUNNER_TEMP/policy-input.json"
          if ! node "$policy" < "$RUNNER_TEMP/policy-input.json"; then
            echo "::error::'state:verified' is set, but the signatures valid at head $HEAD_SHA do not meet the mesh policy (AGENTS.md §6.6). A push after verification needs a fresh signature unless it only merged main and left the PR's own change identical."
            exit 1
          fi
          echo "OK — head $HEAD_SHA verified under the mesh policy."
