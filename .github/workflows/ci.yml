name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend API + shared packages (unit suites run fully mocked) ──────────
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager" — do NOT also pass `with: version:` (the action fails with "Multiple versions of pnpm specified"; this broke the API + AI jobs on main)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm -r --filter "./packages/*" run build
      - name: Generate Prisma client (required for type-check; pnpm install does not create it)
        run: pnpm --filter @familyshield/api exec prisma generate
      - name: Type-check API
        run: pnpm --filter @familyshield/api run build
      - name: API unit tests (vitest, mocked db/redis)
        run: pnpm --filter @familyshield/api run test

  # ── Parent app (Flutter) ───────────────────────────────────────────────────
  parent-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parent-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Store-readiness gate: a release build must compile, shrink and carry INTERNET + the Maps
      # key placeholder. The Maps key is a repository secret (blank is tolerated for the build;
      # the map simply renders empty). Signing: with OSRA_UPLOAD_KEYSTORE_B64 set this produces an
      # upload-key-signed AAB; without it the debug key is used and the job still proves the build.
      # NOTE: the `secrets` context is NOT available in a step `if:` — GitHub rejects the whole
      # workflow file ("Unrecognized named-value: 'secrets'") and zero jobs run, which is exactly
      # how the first push of this PR failed. Decide inside the run body instead.
      - name: Materialise upload keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.OSRA_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "OSRA_UPLOAD_KEYSTORE_B64 not set — release build will use the debug key (by design)"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
          echo "OSRA_UPLOAD_KEYSTORE=upload.jks" >> "$GITHUB_ENV"
          echo "upload keystore materialised"
      - name: Release build (AAB)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          OSRA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.OSRA_UPLOAD_KEYSTORE_PASSWORD }}
          OSRA_UPLOAD_KEY_ALIAS: ${{ secrets.OSRA_UPLOAD_KEY_ALIAS }}
          OSRA_UPLOAD_KEY_PASSWORD: ${{ secrets.OSRA_UPLOAD_KEY_PASSWORD }}
        run: flutter build appbundle --release
      - name: Release manifest must declare INTERNET
        run: |
          unzip -p build/app/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml > /tmp/manifest.bin
          # The AAB manifest is protobuf; the permission string survives as plain text.
          grep -q "android.permission.INTERNET" /tmp/manifest.bin && echo "INTERNET present"
      - uses: actions/upload-artifact@v4
        with:
          name: parent-app-release-aab
          path: apps/parent-app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ── Child agent (Android JVM unit tests — no emulator needed) ─────────────
  child-android:
    # NOTE: this job used `macos-13`, which GitHub has since retired — the job sat "queued" forever
    # and never ran, so the Android suite and the assemble guard were never actually exercised
    # in CI (same class as #37: a gate that looks configured but never executes). Ubuntu runners ship
    # the Android SDK, and nothing here needs macOS.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/child-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Plan 1.8: same upload keystore as the parent app, materialised from the secret when present.
      - name: Materialise upload keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.OSRA_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "OSRA_UPLOAD_KEYSTORE_B64 not set — release APK will use the debug key (by design)"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/upload.jks
          echo "OSRA_UPLOAD_KEYSTORE=app/upload.jks" >> "$GITHUB_ENV"
          echo "upload keystore materialised"
      - name: Unit tests & build (JVM + debug APK + minified release APK)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          OSRA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.OSRA_UPLOAD_KEYSTORE_PASSWORD }}
          OSRA_UPLOAD_KEY_ALIAS: ${{ secrets.OSRA_UPLOAD_KEY_ALIAS }}
          OSRA_UPLOAD_KEY_PASSWORD: ${{ secrets.OSRA_UPLOAD_KEY_PASSWORD }}
        # assembleRelease proves the shrunk (R8), release-signed configuration builds; signing material
        # comes from the secrets above when present and falls back to the debug key. Both release flavours
        # are built because #170's gate asserts `android:testOnly` is absent from each release merge.
        run: ./gradlew testPlayDebugUnitTest testFullDebugUnitTest assemblePlayDebug assembleFullDebug assemblePlayRelease assembleFullRelease --console=plain
      # ADR-0021's gate asserts the *merged* manifest (where a dependency's permissions arrive), so it
      # only means something if the unit tests above actually ran it. The test skips with a loud message
      # when the artefact is missing — that is what an IDE run needs and what CI must never accept — so
      # this step fails the job on a skip, a failure, or a named assertion that disappeared.
      - name: Merged-manifest gate ran and did not skip (ADR-0021)
        working-directory: .
        run: node scripts/check-merged-manifest-gate.mjs
      - name: Release manifest is HTTPS-only and targets 35
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -1)
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'35'" && echo "targetSdk 35"
          # The release config is the one in src/main (src/debug overrides it for the debug build only).
          grep -q 'cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml && echo "release cleartext off"
          grep -q 'cleartextTrafficPermitted="true"' app/src/debug/res/xml/network_security_config.xml && echo "debug cleartext on (dev servers)"
      - uses: actions/upload-artifact@v4
        with:
          name: child-android-apks
          path: |
            apps/child-android/app/build/outputs/apk/debug/*.apk
            apps/child-android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  # ── Windows desktop agent ──────────────────────────────────────────────────
  agent-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/agent-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/FamilyShield.Agent.Tests --nologo

  # ── AI engine (Python) ─────────────────────────────────────────────────────
  ai-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Test deps only: torch/transformers are imported lazily by model.py, so the suite runs in
      # seconds without them (verified: 21 passed vs 18 passed + 1 skipped when fastapi is absent).
      - run: pip install -r requirements-dev.txt
      - run: pytest tests -q

  # ── Probe integrity: the adversarial gate may only be extended (AGENTS.md §4) ──────────────
  # Runs `scripts/check-probe-integrity.mjs` (PR #68) on every pull request: the assertion-name sets
  # of `services/api/scripts/qa-probe.mjs` on the PR head are compared with the base branch, and the
  # job fails on a removed or demoted assertion unless `scripts/probe-gate-acks.json` on the branch
  # acknowledges it with a reason. Cheap (one node script, no install), so it runs on every PR rather
  # than only on PRs that touch the probe — a path filter would make the check look green by absence.
  probe-integrity:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the checker reads the base ref with `git show`
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare probe assertion sets against the base branch
        run: node scripts/check-probe-integrity.mjs --base "origin/${{ github.base_ref }}" --head HEAD

  # NOTE (2026-10-15): iOS is covered by the dedicated `.github/workflows/ios-ci.yml` workflow
  # (SwiftPM build + `generic/platform=iOS Simulator` on macos-14). A second, subtly different
  # `xcodebuild test -destination 'platform=iOS Simulator,name=iPhone 15'` job lived here and failed
  # on the named simulator's availability while ios-ci.yml passed. Two gates disagreeing is worse
  # than one honest gate, so this duplicate was removed. To make iOS required, require the
  # ios-ci.yml check instead of re-adding a job here.

