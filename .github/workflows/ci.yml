name: CI

# What is left here runs on every pull request whatever it touches. The five build-and-test jobs that used to
# live here (api, parent-app, child-android, agent-desktop, ai-engine) moved to their own workflows on
# 2026-10-24, each with a `paths:` filter, so a PR runs only the suites whose inputs it changes:
# `api.yml`, `parent-app.yml`, `child-android.yml`, `agent-desktop.yml`, `ai-engine.yml`. Each also runs on
# every push to main that touches it, and nightly on main whatever changed. The reasons and the numbers are
# in docs/TESTING.md §4; `scripts/check-ci-paths.mjs` (run by workflow-lint) keeps the path lists honest.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Probe integrity: the adversarial gate may only be extended (AGENTS.md §4) ──────────────
  # Runs `scripts/check-probe-integrity.mjs` (PR #68) on every pull request: the assertion-name sets
  # of `services/api/scripts/qa-probe.mjs` on the PR head are compared with the base branch, and the
  # job fails on a removed or demoted assertion unless `scripts/probe-gate-acks.json` on the branch
  # acknowledges it with a reason. Cheap (one node script, no install), so it runs on every PR rather
  # than only on PRs that touch the probe — a path filter would make the check look green by absence.
  probe-integrity:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the checker reads the base ref with `git show`
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare probe assertion sets against the base branch
        run: node scripts/check-probe-integrity.mjs --base "origin/${{ github.base_ref }}" --head HEAD

      # A canary for the gate itself: the same tree compared with itself must produce no finding.
      # Without this, a comparison that is LOUDER than its evidence is indistinguishable from a real
      # removal — and it fails on every PR while being wrong, which is what happened on 2026-10-23: the
      # if/else pattern (a title that is both a check and a target) made the pass report DEMOTED on
      # unchanged input, and two PRs that touch no probe were red for it. One line here would have
      # caught it the day the pattern landed.
      - name: The gate must be quiet on an unchanged tree (canary)
        run: node scripts/check-probe-integrity.mjs --base HEAD --head HEAD

  # NOTE (2026-10-15): iOS is covered by the dedicated `.github/workflows/ios-ci.yml` workflow
  # (SwiftPM build + `generic/platform=iOS Simulator` on macos-14). A second, subtly different
  # `xcodebuild test -destination 'platform=iOS Simulator,name=iPhone 15'` job lived here and failed
  # on the named simulator's availability while ios-ci.yml passed. Two gates disagreeing is worse
  # than one honest gate, so this duplicate was removed. To make iOS required, require the
  # ios-ci.yml check instead of re-adding a job here.

