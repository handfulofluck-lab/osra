# gitleaks configuration (osra-security#26, #609). The default rules stay on; this only allowlists
# reviewed test fixtures, by file AND by the fixture's own variable names, so a real secret added to
# either file is still reported.
[extend]
useDefault = true

[[allowlists]]
description = "Reviewed test fixtures (osra-security#26)"
condition = "AND"
# Without targetRules an allowlist is a whole-file filter: every rule in these files would be skipped
# (Antigravity, #767). With it, only generic-api-key matches on the listed fixture lines are allowed.
targetRules = ["generic-api-key"]
paths = [
  '''^scripts/hardware/scenario-family\.test\.mjs$''',
  '''^services/api/test/auth\.test\.ts$''',
]
regexTarget = "line"
regexes = [
  '''^\s*(password|token)\s*:\s*"''',
  '''^\s*const (oldSecret|attackerSecret)\s*=\s*"''',
]
