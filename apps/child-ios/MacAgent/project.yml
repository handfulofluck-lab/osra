# XcodeGen spec for the Mac content filter's signed route (roadmap 5.9, step (iii), #988).
#
# Why this file exists at all: a Network Extension **system extension** is a bundle the system loads, with an
# executable that calls `NEProvider.startSystemExtensionMode()` and a `NetworkExtension`/`NEProviderClasses`
# entry point. SwiftPM cannot produce that shape — it builds executables and libraries, not signed bundle
# hierarchies — so `scripts/build-filter-extension.sh`'s first version (copy the SwiftPM dylib into
# `CFBundleExecutable`) was the wrong route, and Codex said so on #989 (`7073424029`) with Apple's
# host-bundle-layout reference.
#
# What stays in the Swift package, unchanged and covered by the existing macOS job: the decision table, the
# snapshot store, the liveness store, the capability mapping and the provider class itself
# (`OSRAMacAgentFilterProvider`). This project only assembles them into a loadable bundle and a host app.
#
# Not run in CI: generating and building this needs Xcode and, to be useful, a Developer ID identity and a
# profile carrying `com.apple.developer.networking.networkextension` =
# `content-filter-provider-systemextension`. CI's unsigned checks are `swift build` / `swift test` in the
# package and `plutil -lint` on the plists.
#
# On the test Mac:
#   xcodegen generate --spec apps/child-ios/MacAgent/project.yml --project apps/child-ios/MacAgent
#   xcodebuild -project apps/child-ios/MacAgent/OSRAMacAgent.xcodeproj -scheme OSRAMacHost build
# The extension lands in the host's Contents/Library/SystemExtensions/ by virtue of being a dependency of the
# host target, which is the layout the system expects.
name: OSRAMacAgent

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Public repository: no team id, certificate or profile is ever committed here.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.9"
    # The host is a Developer ID app, outside the App Store, like the daemon (ADR-0036 decision 3).
    CODE_SIGN_IDENTITY: "-"

packages:
  OSRAMacAgent:
    path: .

targets:
  # The minimal host. A system extension cannot be activated by itself: it is submitted from an app bundle that
  # carries it, so this target exists to be that bundle and nothing else. It has no UI.
  OSRAMacHost:
    type: application
    platform: macOS
    sources:
      - path: Host
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: OSRA
        CFBundleIdentifier: com.osratech.agent.host
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    dependencies:
      - target: OSRAFilter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osratech.agent.host
        SKIP_INSTALL: NO
        # Embed the extension where the system looks for it.
        ENABLE_HARDENED_RUNTIME: YES

  # The content filter itself. Sources are the entry point in `SystemExtension/` plus the Swift package product
  # that holds every decision; `FilterExtension/Info.plist` and `FilterExtension/OSRAFilter.entitlements` are
  # the checked-in files CI lints.
  OSRAFilter:
    type: system-extension
    platform: macOS
    sources:
      - path: SystemExtension
    # The checked-in plist is used as-is (no `properties` here, or XcodeGen would rewrite it): CI lints it and
    # the system reads it, so one file has to be the truth.
    info:
      path: FilterExtension/Info.plist
    entitlements:
      path: FilterExtension/OSRAFilter.entitlements
    dependencies:
      - package: OSRAMacAgent
        product: OSRAFilterProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osratech.agent.filter
        PRODUCT_NAME: OSRAFilter
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
