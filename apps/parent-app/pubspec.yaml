name: familyshield_parent
description: FamilyShield parent dashboard
version: 0.1.0
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.0
  dio: ^5.4.3
  web_socket_channel: ^2.4.5
  google_maps_flutter: ^2.7.0
  fl_chart: ^0.68.0
  flutter_secure_storage: ^9.2.0
  # Issue #742: the phone's own biometric or device credential, before a mutation. Approved by Claude
  # (7157129055). No fallback to the app PIN: a PIN a child may have watched is weaker than the promise.
  local_auth: ^3.0.2
  intl: ^0.20.3
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.3
  geocoding: ^5.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test: { sdk: flutter }
  build_runner: ^2.4.10
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
